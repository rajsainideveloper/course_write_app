<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Central Node -->
  <rect x="260" y="20" width="280" height="60" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="50" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">उत्तर प्रदेश जल संसाधन तंत्र</text>

  <!-- Branch 1 -->
  <path d="M 330 80 L 180 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="50" y="160" width="260" height="120" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="180" y="190" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">गंगा बैराज (कानपुर)</text>
  <text x="180" y="220" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">• पेयजल आपूर्ति (लवकुश बैराज)</text>
  <text x="180" y="245" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">• गंगा नदी पर अवस्थित</text>

  <!-- Branch 2 -->
  <path d="M 470 80 L 620 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="490" y="160" width="260" height="120" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="620" y="190" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">रामगंगा बाँध (धामपुर)</text>
  <text x="620" y="220" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">• राज्य का सबसे ऊँचा बाँध (128m)</text>
  <text x="620" y="245" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">• रामगंगा नदी (बिजनौर/पौड़ी)</text>
</svg>