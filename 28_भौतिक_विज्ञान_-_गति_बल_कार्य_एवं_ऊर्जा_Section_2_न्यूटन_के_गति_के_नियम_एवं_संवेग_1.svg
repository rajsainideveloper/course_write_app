<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="420" fill="#F8FAFC" rx="16"/>

  <!-- Title Block -->
  <rect x="250" y="20" width="300" height="45" rx="8" fill="#475569" filter="url(#dropShadow)"/>
  <text x="400" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">न्यूटन के गति के नियम (Newton's Laws)</text>

  <!-- Connectors from Title -->
  <path d="M 400 65 L 400 110 M 400 90 L 160 90 L 160 120 M 400 90 L 640 90 L 640 120 M 400 65 L 400 120" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Law 1 -->
  <g transform="translate(40, 120)" filter="url(#dropShadow)">
    <rect width="240" height="110" rx="10" fill="url(#blueGrad)"/>
    <text x="120" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">प्रथम नियम: जड़त्व का नियम</text>
    <text x="120" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">वस्तु अपनी मूल अवस्था बनाए रखती है।</text>
    <text x="120" y="85" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">उदाहरण: बस रुकने पर यात्री का झुकना</text>
  </g>

  <!-- Law 2 -->
  <g transform="translate(280, 120)" filter="url(#dropShadow)">
    <rect width="240" height="110" rx="10" fill="url(#tealGrad)"/>
    <text x="120" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">द्वितीय नियम: बल का सूत्र</text>
    <text x="120" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">F = ma (बल = द्रव्यमान × त्वरण)</text>
    <text x="120" y="85" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">उदाहरण: कैच लेते समय हाथ पीछे खींचना</text>
  </g>

  <!-- Law 3 -->
  <g transform="translate(520, 120)" filter="url(#dropShadow)">
    <rect width="240" height="110" rx="10" fill="url(#emeraldGrad)"/>
    <text x="120" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">तृतीय नियम: क्रिया-प्रतिक्रिया</text>
    <text x="120" y="60" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">प्रत्येक क्रिया की समान विपरीत प्रतिक्रिया।</text>
    <text x="120" y="85" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">उदाहरण: रॉकेट का उड़ना, बंदूक की रीकॉइल</text>
  </g>

  <!-- Footer Insight Box -->
  <rect x="40" y="270" width="720" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#dropShadow)"/>
  <rect x="40" y="270" width="8" height="110" fill="#475569" rx="2"/>
  <text x="65" y="300" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">परीक्षा उपयोगी मुख्य संबंध (Core Exam Insights):</text>
  <text x="65" y="325" fill="#475569" font-family="system-ui, sans-serif" font-size="13">• प्रथम नियम से बल की 'परिभाषा' (Definition) मिलती है, जबकि द्वितीय नियम से बल का 'व्यंजक/सूत्र' (Formula) प्राप्त होता है।</text>
  <text x="65" y="350" fill="#475569" font-family="system-ui, sans-serif" font-size="13">• संवेग में परिवर्तन की दर (Rate of Change of Momentum) ही आरोपित बाह्य बल के तुल्य होती है।</text>
</svg>