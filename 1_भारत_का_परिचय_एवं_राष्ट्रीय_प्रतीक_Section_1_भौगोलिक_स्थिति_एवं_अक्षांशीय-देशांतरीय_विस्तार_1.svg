<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Grid Concept -->
  <rect width="800" height="450" fill="#F8FAFC" rx="15"/>
  <path d="M 100 0 L 100 450 M 200 0 L 200 450 M 300 0 L 300 450 M 400 0 L 400 450 M 500 0 L 500 450 M 600 0 L 600 450 M 700 0 L 700 450" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Main Grid Axes for India Boundary Points -->
  <!-- North -->
  <rect x="300" y="40" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">उत्तरी बिंदु: इंदिरा कोल</text>
  <text x="400" y="85" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">37°6' N अक्षांश (लद्दाख)</text>

  <!-- South -->
  <rect x="300" y="340" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="400" y="365" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">मुख्य भूमि दक्षिण: कन्याकुमारी</text>
  <text x="400" y="385" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">8°4' N अक्षांश (तमिलनाडु)</text>

  <!-- West -->
  <rect x="40" y="190" width="200" height="60" rx="10" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="140" y="215" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">पश्चिमी बिंदु: गुहार मोती</text>
  <text x="140" y="235" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">68°7' E देशांतर (गुजरात)</text>

  <!-- East -->
  <rect x="560" y="190" width="200" height="60" rx="10" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="660" y="215" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">पूर्वी बिंदु: किबिथू</text>
  <text x="660" y="235" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">97°25' E देशांतर (अरुणाचल प्रदेश)</text>

  <!-- Connecting Lines (Cross-hairs) -->
  <path d="M 400 100 L 400 340" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 240 220 L 560 220" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Center Label Dimensions -->
  <circle cx="400" cy="220" r="25" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
  <text x="400" y="224" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">भारत</text>

  <!-- Extents text -->
  <text x="410" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">उत्तर-दक्षिण: 3,214 किमी</text>
  <text x="450" y="240" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">पूर्व-पश्चिम: 2,933 किमी</text>
</svg>