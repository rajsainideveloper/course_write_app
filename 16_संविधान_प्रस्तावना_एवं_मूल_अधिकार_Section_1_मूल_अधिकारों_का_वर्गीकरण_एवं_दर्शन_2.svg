<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F1F5F9" rx="16"/>
  <text x="400" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">भारतीय नागरिकों के 6 मौलिक अधिकार</text>

  <!-- Box 1 -->
  <rect x="60" y="90" width="320" height="100" rx="8" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <text x="220" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">1. समानता का अधिकार</text>
  <text x="220" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0">अनुच्छेद 14 से 18</text>

  <!-- Box 2 -->
  <rect x="420" y="90" width="320" height="100" rx="8" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <text x="580" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">2. स्वतंत्रता का अधिकार</text>
  <text x="580" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0">अनुच्छेद 19 से 22</text>

  <!-- Box 3 -->
  <rect x="60" y="220" width="320" height="100" rx="8" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <text x="220" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">3. शोषण के विरुद्ध अधिकार</text>
  <text x="220" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0">अनुच्छेद 23 एवं 24</text>

  <!-- Box 4 -->
  <rect x="420" y="220" width="320" height="100" rx="8" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <text x="580" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">4. धार्मिक स्वतंत्रता का अधिकार</text>
  <text x="580" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0">अनुच्छेद 25 से 28</text>

  <!-- Box 5 -->
  <rect x="60" y="350" width="320" height="100" rx="8" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <text x="220" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">5. सांस्कृतिक एवं शैक्षिक अधिकार</text>
  <text x="220" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0">अनुच्छेद 29 एवं 30</text>

  <!-- Box 6 -->
  <rect x="420" y="350" width="320" height="100" rx="8" fill="url(#boxGrad)" filter="url(#boxShadow)"/>
  <text x="580" y="395" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">6. संवैधानिक उपचारों का अधिकार</text>
  <text x="580" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0">अनुच्छेद 32</text>
</svg>