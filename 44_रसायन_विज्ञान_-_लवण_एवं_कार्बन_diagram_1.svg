<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Box 1 -->
  <rect x="20" y="70" width="220" height="90" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="130" y="105" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">शुष्क बुझा चूना</text>
  <text x="130" y="130" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Ca(OH)₂</text>

  <!-- Arrow 1 -->
  <path d="M 240 115 L 280 115" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="260" y="95" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Cl₂ (40°C)</text>

  <!-- Box 2 -->
  <rect x="290" y="70" width="220" height="90" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="400" y="105" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ब्लीचिंग पाउडर</text>
  <text x="400" y="130" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">CaOCl₂ + H₂O</text>

  <!-- Arrow 2 -->
  <path d="M 510 115 L 550 115" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="530" y="95" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">वायु में खुला</text>

  <!-- Box 3 -->
  <rect x="560" y="70" width="220" height="90" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="670" y="105" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">मुक्त क्लोरीन</text>
  <text x="670" y="130" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">तीव्र गंध (विरंजन/कीटाणुनाशन)</text>
</svg>