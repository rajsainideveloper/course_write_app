<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="condGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="convGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="radGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="400" y="45" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">
    ऊष्मा स्थानांतरण की विधियाँ (Methods of Heat Transfer)
  </text>

  <!-- Box 1: Conduction -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="210" height="250" rx="12" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <text x="155" y="130" fill="#60A5FA" font-size="18" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">चालन (Conduction)</text>
    <rect x="70" y="150" width="170" height="12" rx="6" fill="url(#condGrad)"/>
    <text x="155" y="195" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">माध्यम: ठोस (Solids)</text>
    <text x="155" y="225" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">कण स्थान नहीं बदलते</text>
    <text x="155" y="250" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">केवल कंपन द्वारा स्थानांतरण</text>
    <rect x="70" y="280" width="170" height="36" rx="6" fill="#0F172A"/>
    <text x="155" y="303" fill="#FCD34D" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">उदा: गर्म धातु की छड़</text>
  </g>

  <!-- Box 2: Convection -->
  <g filter="url(#shadow)">
    <rect x="295" y="90" width="210" height="250" rx="12" fill="#065F46" stroke="#10B981" stroke-width="2"/>
    <text x="400" y="130" fill="#34D399" font-size="18" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">संवहन (Convection)</text>
    <!-- Cyclic Arrows Symbol -->
    <circle cx="400" cy="165" r="18" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="25 10"/>
    <text x="400" y="210" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">माध्यम: द्रव एवं गैस (Fluids)</text>
    <text x="400" y="235" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">कणों की वास्तविक गति</text>
    <text x="400" y="255" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">संवहन धाराओं का निर्माण</text>
    <rect x="315" y="280" width="170" height="36" rx="6" fill="#0F172A"/>
    <text x="400" y="303" fill="#FCD34D" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">उदा: जल का उबलना</text>
  </g>

  <!-- Box 3: Radiation -->
  <g filter="url(#shadow)">
    <rect x="540" y="90" width="210" height="250" rx="12" fill="#701A75" stroke="#E879F9" stroke-width="2"/>
    <text x="645" y="130" fill="#F472B6" font-size="18" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">विकिरण (Radiation)</text>
    <path d="M 575 165 Q 595 155 615 165 T 655 165 T 695 165" fill="none" stroke="#E879F9" stroke-width="2.5"/>
    <text x="645" y="210" fill="#E2E8F0" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">माध्यम: आवश्यकता नहीं</text>
    <text x="645" y="235" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">विद्युत चुंबकीय तरंगें</text>
    <text x="645" y="255" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">प्रकाश की तीव्र चाल</text>
    <rect x="560" y="280" width="170" height="36" rx="6" fill="#0F172A"/>
    <text x="645" y="303" fill="#FCD34D" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">उदा: सूर्य की ऊष्मा</text>
  </g>
</svg>