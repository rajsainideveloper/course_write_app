<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="warGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title Block -->
  <rect x="0" y="0" width="800" height="50" fill="url(#warGrad)"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">महत्वपूर्ण आंग्ल-मराठा युद्ध एवं संधियाँ</text>

  <!-- War 1 -->
  <rect x="30" y="80" width="740" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="30" y="80" width="160" height="90" rx="6" fill="#1E3A8A"/>
  <text x="110" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">प्रथम युद्ध (1775-1782)</text>
  <text x="210" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">मुख्य संधि: सालाबाई की संधि (1782)</text>
  <text x="210" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">रघुनाथ राव (राघोबा) की पेशवा बनने की महत्वाकांक्षा के कारण शुरू हुआ। 20 वर्षों की शांति स्थापित हुई।</text>

  <!-- War 2 -->
  <rect x="30" y="190" width="740" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="30" y="190" width="160" height="90" rx="6" fill="#0D9488"/>
  <text x="110" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">द्वितीय युद्ध (1803-1805)</text>
  <text x="210" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">मुख्य संधि: बेसिन की संधि (1802) और देवगाँव/सुरजी-अर्जनगाँव</text>
  <text x="210" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">पेशवा बाजीराव द्वितीय ने वेलेजली की सहायक संधि (Subsidiary Alliance) स्वीकार की। भोंसले और सिंधिया पराजित।</text>

  <!-- War 3 -->
  <rect x="30" y="300" width="740" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="30" y="300" width="160" height="90" rx="6" fill="#B45309"/>
  <text x="110" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">तृतीय युद्ध (1817-1818)</text>
  <text x="210" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">मुख्य संधि: पुणे की संधि (1817) - मराठा साम्राज्य का अंत</text>
  <text x="210" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">लॉर्ड हेस्टिंग्स ने पिंडारियों के दमन के बहाने मराठों को घेरा। पेशवा का पद समाप्त कर उन्हें बिठूर (कानपुर) भेजा गया।</text>
</svg>