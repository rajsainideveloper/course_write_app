<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title background -->
  <rect x="10" y="10" width="780" height="40" rx="8" fill="#F1F5F9" />
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">पारंपरिक प्रोग्रामिंग बनाम मशीन लर्निंग (Traditional Programming vs Machine Learning)</text>

  <!-- Left Side: Traditional Programming -->
  <rect x="40" y="70" width="340" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="70" width="340" height="35" rx="10" fill="url(#blueGrad)" />
  <text x="210" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">पारंपरिक प्रोग्रामिंग (Traditional)</text>

  <rect x="60" y="125" width="120" height="35" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="120" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">डेटा (Data)</text>

  <rect x="60" y="175" width="120" height="35" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="120" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1E3A8A" text-anchor="middle">नियम (Rules/Code)</text>

  <path d="M 180 142 L 230 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 180 192 L 230 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <circle cx="250" cy="160" r="20" fill="#1E3A8A" />
  <text x="250" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">CPU</text>

  <path d="M 270 160 L 310 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <rect x="310" y="142" width="60" height="35" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1" />
  <text x="340" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#15803D" text-anchor="middle">उत्तर</text>

  <!-- Right Side: Machine Learning -->
  <rect x="420" y="70" width="340" height="230" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  <rect x="420" y="70" width="340" height="35" rx="10" fill="url(#tealGrad)" />
  <text x="590" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">मशीन लर्निंग (Machine Learning)</text>

  <rect x="440" y="125" width="120" height="35" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1" />
  <text x="500" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#115E59" text-anchor="middle">डेटा (Data)</text>

  <rect x="440" y="175" width="120" height="35" rx="6" fill="#CCFBF1" stroke="#0D9488" stroke-width="1" />
  <text x="500" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#115E59" text-anchor="middle">उत्तर (Output/Labels)</text>

  <path d="M 560 142 L 610 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 560 192 L 610 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <circle cx="630" cy="160" r="20" fill="#0D9488" />
  <text x="630" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">ML</text>

  <path d="M 650 160 L 685 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <rect x="685" y="142" width="65" height="35" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1" />
  <text x="717" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">नियम</text>

</svg>