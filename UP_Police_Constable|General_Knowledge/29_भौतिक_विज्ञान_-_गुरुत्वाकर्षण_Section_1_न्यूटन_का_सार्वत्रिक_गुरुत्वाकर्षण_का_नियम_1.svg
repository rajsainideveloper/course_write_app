<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Mass m1 -->
  <circle cx="200" cy="120" r="55" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="200" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">m₁</text>
  <text x="200" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E0F2FE" text-anchor="middle" dy=".3em">द्रव्यमान 1</text>

  <!-- Mass m2 -->
  <circle cx="600" cy="120" r="40" fill="url(#grad2)" filter="url(#shadow)" />
  <text x="600" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">m₂</text>
  <text x="600" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ECFDF5" text-anchor="middle" dy=".3em">द्रव्यमान 2</text>

  <!-- Force Vectors -->
  <path d="M 270 120 L 350 120" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#arrow-right)"/>
  <text x="310" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">F₁₂</text>

  <path d="M 530 120 L 450 120" stroke="#DC2626" stroke-width="3" fill="none" marker-end="url(#arrow-right)"/>
  <text x="490" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">F₂₁</text>

  <!-- Distance Line -->
  <line x1="200" y1="200" x2="600" y2="200" stroke="#64748B" stroke-width="2" stroke-dasharray="6,6" />
  <line x1="200" y1="185" x2="200" y2="215" stroke="#64748B" stroke-width="2" />
  <line x1="600" y1="185" x2="600" y2="215" stroke="#64748B" stroke-width="2" />
  <text x="400" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#1E293B" text-anchor="middle">दूरी (r)</text>
</svg>