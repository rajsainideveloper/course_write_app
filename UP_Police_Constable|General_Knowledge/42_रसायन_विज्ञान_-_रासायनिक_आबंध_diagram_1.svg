<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="300" y="20" width="200" height="60" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">रासायनिक आबंध के प्रकार</text>

  <path d="M 350 80 L 120 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 80 L 310 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 80 L 490 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450 80 L 680 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="150" width="180" height="70" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="120" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">आयनिक आबंध</text>
  <text x="120" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E0F2FE" text-anchor="middle">इलेक्ट्रॉन का स्थानांतरण</text>

  <rect x="220" y="150" width="180" height="70" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="310" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">सहसंयोजक आबंध</text>
  <text x="310" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E0F2FE" text-anchor="middle">बराबर की साझेदारी</text>

  <rect x="410" y="150" width="180" height="70" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="500" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उपसहसंयोजक आबंध</text>
  <text x="500" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E0F2FE" text-anchor="middle">एकतरफा साझा</text>

  <rect x="600" y="150" width="180" height="70" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="690" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">धात्विक आबंध</text>
  <text x="690" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E0F2FE" text-anchor="middle">समुद्र-इलेक्ट्रॉन मॉडल</text>

  <rect x="30" y="270" width="180" height="50" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="120" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dy=".3em">उदा: NaCl, MgO</text>

  <rect x="220" y="270" width="180" height="50" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="310" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dy=".3em">उदा: H₂, O₂, CH₄</text>

  <rect x="410" y="270" width="180" height="50" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="500" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dy=".3em">उदा: NH₄⁺, O₃, CO</text>

  <rect x="600" y="270" width="180" height="50" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="690" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" dy=".3em">उदा: Cu, Fe, Na (धातुएं)</text>

  <path d="M 120 220 L 120 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 310 220 L 310 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 220 L 500 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 690 220 L 690 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>