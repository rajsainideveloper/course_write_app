<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F8FAFC" rx="12"/>
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">गति के प्राचलों का अंतर्संबंध एवं समीकरण</text>

  <!-- Parameter Boxes -->
  <rect x="50" y="90" width="200" height="70" rx="8" fill="url(#blueGrad)" filter="url(#boxShadow)"/>
  <text x="150" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">चाल (अदिश) व वेग (सदिश)</text>
  <text x="150" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">मात्रक: m/s</text>

  <rect x="550" y="90" width="200" height="70" rx="8" fill="url(#blueGrad)" filter="url(#boxShadow)"/>
  <text x="650" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">त्वरण (Acceleration)</text>
  <text x="650" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">वेग परिवर्तन की दर (m/s²)</text>

  <!-- Connectors -->
  <path d="M 250 125 L 540 125" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="4"/>

  <!-- Equations Box -->
  <rect x="150" y="200" width="500" height="110" rx="10" fill="url(#tealGrad)" filter="url(#boxShadow)"/>
  <text x="400" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">एकसमान त्वरण हेतु गति के तीन समीकरण</text>
  <text x="400" y="260" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#FEF08A">v = u + at   |   s = ut + ½at²</text>
  <text x="400" y="290" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#FEF08A">v² = u² + 2as</text>
</svg>