<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Box 1 -->
  <rect x="30" y="70" width="200" height="100" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="130" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1839: डागुएरोटाइप</text>
  <text x="130" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">सिल्वर-प्लेटेड तांबे की प्लेट</text>

  <!-- Arrow 1 -->
  <path d="M 230 120 L 290 120" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Box 2 -->
  <rect x="300" y="70" width="200" height="100" rx="10" ry="10" fill="url(#grad2)" filter="url(#shadow)" />
  <text x="400" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1888: रोल फिल्म (Kodak)</text>
  <text x="400" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">जॉर्ज ईस्टमैन द्वारा वाणिज्यीकरण</text>

  <!-- Arrow 2 -->
  <path d="M 500 120 L 560 120" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Box 3 -->
  <rect x="570" y="70" width="200" height="100" rx="10" ry="10" fill="url(#grad3)" filter="url(#shadow)" />
  <text x="670" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">आधुनिक युग: डिजिटल सेंसर</text>
  <text x="670" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">CCD/CMOS एवं स्मार्टफोन</text>
</svg>