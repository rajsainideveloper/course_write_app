<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Background -->
  <rect x="200" y="20" width="400" height="45" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="400" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उत्तर प्रदेश के प्रमुख सांस्कृतिक अंचल एवं नृत्य</text>

  <!-- Connectors -->
  <path d="M 400 65 L 150 150" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 65 L 400 150" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 65 L 650 150" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Node 1: ब्रज क्षेत्र -->
  <rect x="50" y="150" width="200" height="180" rx="10" ry="10" fill="url(#grad2)" filter="url(#shadow)" />
  <text x="150" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ब्रज क्षेत्र</text>
  <line x1="70" y1="195" x2="230" y2="195" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <text x="150" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• रासलीला</text>
  <text x="150" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• चरकुला (108 दीपक)</text>
  <text x="150" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• मयूर नृत्य</text>
  <text x="150" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• लठमार होली</text>

  <!-- Node 2: बुंदेलखंड क्षेत्र -->
  <rect x="300" y="150" width="200" height="180" rx="10" ry="10" fill="url(#grad3)" filter="url(#shadow)" />
  <text x="400" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">बुंदेलखंड क्षेत्र</text>
  <line x1="320" y1="195" x2="480" y2="195" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <text x="400" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• ख्याल नृत्य</text>
  <text x="400" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• पाई-डंडा (अहीर समाज)</text>
  <text x="400" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• राई नृत्य (मयूर शैली)</text>
  <text x="400" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• देवी नृत्य / शैरा</text>

  <!-- Node 3: पूर्वांचल व अवध -->
  <rect x="550" y="150" width="200" height="180" rx="10" ry="10" fill="url(#grad4)" filter="url(#shadow)" />
  <text x="650" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">पूर्वांचल व अवध</text>
  <line x1="570" y1="195" x2="730" y2="195" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <text x="650" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• धोबिया नृत्य (पूर्वांचल)</text>
  <text x="650" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• नटवारी (अहीर समाज)</text>
  <text x="650" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• जोगिनी नृत्य (अवध)</text>
  <text x="650" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">• कलाबाजी (अवध)</text>
</svg>