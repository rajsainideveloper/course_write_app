<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Title Background -->
  <rect x="20" y="20" width="760" height="360" rx="15" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <text x="400" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">वायुमंडलीय दाब का ऊंचाई के साथ परिवर्तन एवं प्रभाव</text>

  <!-- Column 1: Sea Level -->
  <rect x="60" y="100" width="200" height="230" rx="10" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="160" y="130" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">समुद्र तल (Sea Level)</text>
  <text x="160" y="170" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• वायु स्तंभ की ऊंचाई: अधिकतम</text>
  <text x="160" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• वायुमंडलीय दाब: 1 atm</text>
  <text x="160" y="230" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• पारा स्तंभ: 76 cm Hg</text>
  <text x="160" y="260" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• क्वथनांक: सामान्य (100°C)</text>

  <!-- Arrow 1 -->
  <path d="M 270 215 L 310 215" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Column 2: High Altitude -->
  <rect x="320" y="100" width="200" height="230" rx="10" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="420" y="130" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">उच्च पर्वतीय क्षेत्र</text>
  <text x="420" y="170" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• वायु घनत्व में कमी</text>
  <text x="420" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• दाब में अत्यधिक गिरावट</text>
  <text x="420" y="230" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• नाक से खून बहना (Nosebleed)</text>
  <text x="420" y="260" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• पेन की स्याही का रिसाव</text>

  <!-- Arrow 2 -->
  <path d="M 530 215 L 570 215" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Column 3: Thermal Effect -->
  <rect x="580" y="100" width="180" height="230" rx="10" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="670" y="130" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">क्वथनांक प्रभाव</text>
  <text x="670" y="170" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• दाब घटने से क्वथनांक घटता है</text>
  <text x="670" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• जल &lt; 100°C पर उबलता है</text>
  <text x="670" y="230" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• भोजन देरी से पकता है</text>
  <text x="670" y="260" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">• प्रेशर कुकर अनिवार्य</text>
</svg>