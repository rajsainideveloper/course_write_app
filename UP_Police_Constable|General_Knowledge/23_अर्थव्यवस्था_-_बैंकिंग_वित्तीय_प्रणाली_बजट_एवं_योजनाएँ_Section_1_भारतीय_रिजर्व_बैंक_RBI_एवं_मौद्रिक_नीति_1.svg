<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%">
  <defs>
    <linearGradient id="rbiCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="funcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="rbiShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Central Node -->
  <g transform="translate(280, 20)" filter="url(#rbiShadow)">
    <rect width="240" height="70" rx="12" fill="url(#rbiCoreGrad)" />
    <text x="120" y="33" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">भारतीय रिजर्व बैंक (RBI)</text>
    <text x="120" y="55" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">स्थापना: 1935 | राष्ट्रीयकरण: 1949</text>
  </g>

  <!-- Connectors LEFT -->
  <path d="M 280 55 L 160 55 L 160 120" stroke="#94A3B8" stroke-width="2" fill="none" />
  <!-- Connectors RIGHT -->
  <path d="M 520 55 L 640 55 L 640 120" stroke="#94A3B8" stroke-width="2" fill="none" />

  <!-- LEFT: Core Functions -->
  <g transform="translate(40, 120)" filter="url(#rbiShadow)">
    <rect width="240" height="320" rx="12" fill="url(#funcGrad)" />
    <text x="120" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">केंद्रीय बैंक के मुख्य कार्य</text>
    <line x1="20" y1="45" x2="220" y2="45" stroke="#A7F3D0" stroke-width="1" />
    
    <rect x="15" y="60" width="210" height="45" rx="6" fill="#FFFFFF" fill-opacity="0.15" />
    <text x="120" y="87" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">करेंसी जारीकर्ता (Note Issuer)</text>
    
    <rect x="15" y="120" width="210" height="45" rx="6" fill="#FFFFFF" fill-opacity="0.15" />
    <text x="120" y="147" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">सरकार का बैंकर (Banker to Govt)</text>
    
    <rect x="15" y="180" width="210" height="45" rx="6" fill="#FFFFFF" fill-opacity="0.15" />
    <text x="120" y="207" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">बैंकों का बैंक (Banker's Bank)</text>

    <rect x="15" y="240" width="210" height="45" rx="6" fill="#FFFFFF" fill-opacity="0.15" />
    <text x="120" y="267" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">विदेशी मुद्रा भंडार का संरक्षक</text>
  </g>

  <!-- RIGHT: Monetary Tools -->
  <g transform="translate(520, 120)" filter="url(#shadow)">
    <rect width="240" height="320" rx="12" fill="url(#toolGrad)" />
    <text x="120" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">मौद्रिक नीति के उपकरण</text>
    <line x1="20" y1="45" x2="220" y2="45" stroke="#CCFBF1" stroke-width="1" />
    
    <text x="25" y="80" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">नकद आरक्षित अनुपात (CRR)</text>
    <text x="25" y="105" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">RBI के पास नकद सुरक्षा कोष</text>
    
    <text x="25" y="145" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">वैधानिक तरलता अनुपात (SLR)</text>
    <text x="25" y="170" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">स्वयं के पास तरल परिसंपत्तियाँ</text>
    
    <text x="25" y="210" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">रेपो दर (Repo Rate)</text>
    <text x="25" y="235" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">वाणिज्यिक बैंकों को ऋण दर</text>

    <text x="25" y="275" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">खुले बाजार की क्रियाएं (OMO)</text>
    <text x="25" y="300" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">सरकारी प्रतिभूतियों का क्रय-विक्रय</text>
  </g>
</svg>