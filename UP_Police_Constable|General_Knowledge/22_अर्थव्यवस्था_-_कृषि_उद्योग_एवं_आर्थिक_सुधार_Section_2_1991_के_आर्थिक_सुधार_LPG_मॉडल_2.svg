<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="shadow-all" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Central Title Block -->
  <rect x="250" y="20" width="300" height="60" rx="10" fill="#64748B" filter="url(#shadow-all)" />
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">1991 के आर्थिक सुधार (LPG)</text>

  <!-- Connectors -->
  <path d="M 400 80 L 175 160" stroke="#94A3B8" stroke-width="3" fill="none" />
  <path d="M 400 80 L 400 160" stroke="#94A3B8" stroke-width="3" fill="none" />
  <path d="M 400 80 L 625 160" stroke="#94A3B8" stroke-width="3" fill="none" />

  <!-- Liberalization -->
  <g transform="translate(60, 160)" filter="url(#shadow-all)">
    <rect width="230" height="220" rx="12" fill="url(#lGrad)" />
    <text x="115" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">उदारीकरण</text>
    <text x="115" y="60" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="14" font-style="italic" text-anchor="middle">(Liberalization)</text>
    <line x1="20" y1="80" x2="210" y2="80" stroke="#3B82F6" stroke-width="1" />
    <text x="20" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• लाइसेंस राज की समाप्ति</text>
    <text x="20" y="140" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• नियमों का सरलीकरण</text>
    <text x="20" y="170" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• व्यापारिक प्रतिबंधों में छूट</text>
  </g>

  <!-- Privatization -->
  <g transform="translate(285, 160)" filter="url(#shadow-all)">
    <rect width="230" height="220" rx="12" fill="url(#pGrad)" />
    <text x="115" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">निजीकरण</text>
    <text x="115" y="60" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="14" font-style="italic" text-anchor="middle">(Privatization)</text>
    <line x1="20" y1="80" x2="210" y2="80" stroke="#0D9488" stroke-width="1" />
    <text x="20" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• विनिवेश (Disinvestment)</text>
    <text x="20" y="140" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• सार्वजनिक उपक्रमों में</text>
    <text x="32" y="160" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">निजी स्वामित्व को अनुमति</text>
  </g>

  <!-- Globalization -->
  <g transform="translate(510, 160)" filter="url(#shadow-all)">
    <rect width="230" height="220" rx="12" fill="url(#gGrad)" />
    <text x="115" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">वैश्वीकरण</text>
    <text x="115" y="60" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="14" font-style="italic" text-anchor="middle">(Globalization)</text>
    <line x1="20" y1="80" x2="210" y2="80" stroke="#10B981" stroke-width="1" />
    <text x="20" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• अर्थव्यवस्था का जुड़ाव</text>
    <text x="20" y="140" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• आयात शुल्क (Tariff) कटौती</text>
    <text x="20" y="170" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• FDI सीमाओं में वृद्धि</text>
  </g>
</svg>