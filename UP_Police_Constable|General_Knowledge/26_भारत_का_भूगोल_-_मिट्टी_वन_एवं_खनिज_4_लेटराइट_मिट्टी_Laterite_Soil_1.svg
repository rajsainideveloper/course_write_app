<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%">
  <defs>
    <linearGradient id="alluvial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="laterite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <text x="400" y="35" fill="#111827" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">भारतीय मृदा वितरण एवं क्षेत्रफल प्रतिशत</text>
  <line x1="100" y1="50" x2="700" y2="50" stroke="#E5E7EB" stroke-width="2" />

  <!-- Card 1 -->
  <g transform="translate(40, 80)" filter="url(#shadow)">
    <rect width="330" height="100" rx="10" fill="url(#alluvial)" />
    <text x="20" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">जलोढ़ मृदा (Alluvial Soil) ~ 43.4%</text>
    <text x="20" y="70" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12">• सर्वाधिक उपजाऊ, पोटाश युक्त, खादर-भाँगर विभाजन</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(430, 80)" filter="url(#shadow)">
    <rect width="330" height="100" rx="10" fill="url(#red)" />
    <text x="20" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">लाल मृदा (Red Soil) ~ 18.6%</text>
    <text x="20" y="70" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="12">• फेरिक ऑक्साइड के कारण लाल रंग, प्रायद्वीपीय भारत</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(40, 220)" filter="url(#shadow)">
    <rect width="330" height="100" rx="10" fill="url(#black)" />
    <text x="20" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">काली मृदा (Black / Regur) ~ 15%</text>
    <text x="20" y="70" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="12">• बेसाल्ट लावा से निर्मित, कपास हेतु उपयुक्त, स्वतः जुताई</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(430, 220)" filter="url(#shadow)">
    <rect width="330" height="100" rx="10" fill="url(#laterite)" />
    <text x="20" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">लेटराइट मृदा (Laterite Soil) ~ 3.7%</text>
    <text x="20" y="70" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="12">• तीव्र निक्षालन (Leaching) का परिणाम, चाय-काजू की कृषि</text>
  </g>
</svg>