<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="360" rx="15" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="35" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">प्रतिरोधों के संयोजन का तुलनात्मक आरेख</text>

  <!-- Left Side: Series Combination -->
  <g transform="translate(40, 60)">
    <rect width="340" height="270" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#dropShadow)"/>
    <rect x="20" y="15" width="300" height="40" rx="6" fill="url(#boxGrad1)"/>
    <text x="170" y="40" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">श्रेणी क्रम (Series Combination)</text>
    
    <!-- Series Diagram Elements -->
    <path d="M 40 120 L 80 120 L 90 105 L 105 135 L 120 105 L 135 135 L 150 120 L 190 120 L 200 105 L 215 135 L 230 105 L 245 135 L 260 120 L 300 120" stroke="#38BDF8" stroke-width="3" fill="none"/>
    <text x="115" y="95" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">R₁</text>
    <text x="225" y="95" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">R₂</text>
    
    <!-- Text Rules -->
    <text x="30" y="170" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">• समान धारा (I₁ = I₂ = I)</text>
    <text x="30" y="195" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">• विभक्त विभवांतर (V = V₁ + V₂)</text>
    <text x="30" y="225" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">R_eq = R₁ + R₂ + R₃ ...</text>
    <text x="30" y="250" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">परिणामी प्रतिरोध उच्चतम मान से अधिक</text>
  </g>

  <!-- Right Side: Parallel Combination -->
  <g transform="translate(420, 60)">
    <rect width="340" height="270" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#dropShadow)"/>
    <rect x="20" y="15" width="300" height="40" rx="6" fill="url(#boxGrad2)"/>
    <text x="170" y="40" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">समान्तर क्रम (Parallel Combination)</text>
    
    <!-- Parallel Diagram Elements -->
    <path d="M 40 120 L 100 120 L 100 90 L 130 90 L 140 80 L 150 100 L 160 80 L 170 100 L 180 90 L 240 90 L 240 120 L 300 120" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <path d="M 100 120 L 100 150 L 130 150 L 140 140 L 150 160 L 160 140 L 170 160 L 180 150 L 240 150 L 240 120" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <text x="155" y="73" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">R₁</text>
    <text x="155" y="178" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">R₂</text>
    
    <!-- Text Rules -->
    <text x="30" y="170" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">• समान विभवांतर (V₁ = V₂ = V)</text>
    <text x="30" y="195" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">• विभक्त धारा (I = I₁ + I₂)</text>
    <text x="30" y="225" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold">1/R_eq = 1/R₁ + 1/R₂ + ...</text>
    <text x="30" y="250" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">घरेलू वायरिंग में प्रयुक्त (न्यूनतम प्रतिरोध)</text>
  </g>
</svg>