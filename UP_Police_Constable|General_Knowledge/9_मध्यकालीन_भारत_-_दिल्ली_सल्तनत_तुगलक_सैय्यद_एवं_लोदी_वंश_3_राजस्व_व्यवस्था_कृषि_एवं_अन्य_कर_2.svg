<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title background and text -->
  <rect x="200" y="10" width="400" height="40" rx="8" fill="#F1F5F9"/>
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">सल्तनत कालीन शरीयत सम्मत कर प्रणाली</text>

  <!-- Tax 1: खराज -->
  <rect x="60" y="80" width="310" height="160" rx="12" fill="url(#blueGrad)" filter="url(#boxShadow)"/>
  <text x="215" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">खराज (Kharaj)</text>
  <line x1="90" y1="135" x2="340" y2="135" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="215" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0F2FE" text-anchor="middle">गैर-मुस्लिमों से लिया जाने वाला भूमि कर</text>
  <text x="215" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">सामान्यतः उपज का 1/3 से 1/2 भाग</text>

  <!-- Tax 2: जज़िया -->
  <rect x="430" y="80" width="310" height="160" rx="12" fill="url(#blueGrad)" filter="url(#boxShadow)"/>
  <text x="585" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">जज़िया (Jizya)</text>
  <line x1="460" y1="135" x2="710" y2="135" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="585" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0F2FE" text-anchor="middle">गैर-मुस्लिमों से लिया जाने वाला धार्मिक/सुरक्षा कर</text>
  <text x="585" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">फिरोज तुगलक ने इसे ब्राह्मणों पर भी लगाया</text>

  <!-- Tax 3: ज़कात -->
  <rect x="60" y="280" width="310" height="160" rx="12" fill="url(#tealGrad)" filter="url(#boxShadow)"/>
  <text x="215" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ज़कात (Zakat)</text>
  <line x1="90" y1="335" x2="340" y2="335" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="215" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0F2FE" text-anchor="middle">केवल मुस्लिमों से लिया जाने वाला धार्मिक कर</text>
  <text x="215" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4" text-anchor="middle">उनकी कुल संपत्ति/आय का 2.5% (1/40 वां भाग)</text>

  <!-- Tax 4: खुम्स -->
  <rect x="430" y="280" width="310" height="160" rx="12" fill="url(#tealGrad)" filter="url(#boxShadow)"/>
  <text x="585" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">खुम्स (Khums)</text>
  <line x1="460" y1="335" x2="710" y2="335" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="585" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0F2FE" text-anchor="middle">युद्ध में लूटे गए माल या गड़े धन का कर</text>
  <text x="585" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4" text-anchor="middle">नियमतः 4/5 भाग सैनिकों का, 1/5 भाग राजकोष का</text>
</svg>