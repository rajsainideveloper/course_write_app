<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="gradLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Level 1: Central Cabinet -->
  <rect x="250" y="20" width="300" height="60" rx="10" ry="10" fill="url(#gradTop)" filter="url(#shadow)" />
  <text x="400" y="50" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">केंद्रीय मंत्रिमंडल (Central Cabinet)</text>

  <!-- Connectors from Level 1 to Level 2 -->
  <path d="M 320 80 L 200 140" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 480 80 L 600 140" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 2: Interventions -->
  <rect x="50" y="140" width="300" height="60" rx="10" ry="10" fill="url(#gradMid)" filter="url(#shadow)" />
  <text x="200" y="170" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dy=".3em">आर्थिक एवं औद्योगिक स्वीकृतियाँ</text>

  <rect x="450" y="140" width="300" height="60" rx="10" ry="10" fill="url(#gradMid)" filter="url(#shadow)" />
  <text x="600" y="170" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dy=".3em">अवसंरचना एवं सुरक्षा अवधारण</text>

  <!-- Connectors from Level 2 to Level 3 -->
  <path d="M 200 200 L 200 260" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 600 200 L 600 260" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 3: Ground Level Impact -->
  <rect x="50" y="260" width="300" height="70" rx="10" ry="10" fill="url(#gradLow)" filter="url(#shadow)" />
  <text x="200" y="285" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SME ग्रोथ फंड (₹10,000 Cr)</text>
  <text x="200" y="308" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">एवं वस्त्र क्षेत्र विकास (समर्थ 2.0)</text>

  <rect x="450" y="260" width="300" height="70" rx="10" ry="10" fill="url(#gradLow)" filter="url(#shadow)" />
  <text x="600" y="285" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">UP डिफेंस कॉरिडोर एवं पुलिस सुदृढ़ीकरण</text>
  <text x="600" y="308" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">साइबर क्राइम थानों का विस्तार</text>
</svg>