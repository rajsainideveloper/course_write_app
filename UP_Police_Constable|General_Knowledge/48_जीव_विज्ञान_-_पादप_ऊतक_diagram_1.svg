<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Root Level -->
  <rect x="275" y="20" width="250" height="50" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">पादप ऊतक (Plant Tissues)</text>

  <!-- Connectors from Root -->
  <path d="M 400 70 L 400 110 L 200 110 L 200 140" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 70 L 400 110 L 600 110 L 600 140" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 1 -->
  <rect x="80" y="140" width="240" height="50" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="200" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">विभज्योतक (Meristematic)</text>

  <rect x="480" y="140" width="240" height="50" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="600" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">स्थायी ऊतक (Permanent)</text>

  <!-- Connectors from Permanent -->
  <path d="M 600 190 L 600 230 L 480 230 L 480 260" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 600 190 L 600 230 L 720 230 L 720 260" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 2 (Permanent Subtypes) -->
  <rect x="400" y="260" width="160" height="45" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="480" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">सरल स्थायी ऊतक</text>

  <rect x="640" y="260" width="160" height="45" rx="8" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="720" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">जटिल स्थायी ऊतक</text>

  <!-- Level 3 Details -->
  <text x="480" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• पैरेन्काइमा</text>
  <text x="480" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• कोलेन्काइमा</text>
  <text x="480" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• स्क्लेरेन्काइमा</text>

  <text x="720" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• जाइलम (Xylem)</text>
  <text x="720" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• फ्लोएम (Phloem)</text>
</svg>