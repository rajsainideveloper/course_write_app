<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#991B1B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748B;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Central Title -->
  <rect x="150" y="15" width="500" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="400" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">औरंगज़ेब की बहु-आयामी संकटकारी नीतियां</text>

  <!-- Central Hub -->
  <circle cx="400" cy="260" r="65" fill="url(#redGrad)" filter="url(##dropShadow)"/>
  <text x="400" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">औरंगज़ेब</text>
  <text x="400" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FEE2E2" text-anchor="middle">(1658-1707 ई.)</text>

  <!-- Node 1: Deccan Policy -->
  <rect x="40" y="100" width="260" height="85" rx="10" fill="url(#slateGrad)"/>
  <text x="170" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. दक्कन की नीति (सूरजमुखी घाव)</text>
  <text x="170" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">• बीजापुर (1686) व गोलकुंडा (1687) विलय</text>
  <path d="M 230 185 L 340 230" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Node 2: Religious Policy -->
  <rect x="500" y="100" width="260" height="85" rx="10" fill="url(#slateGrad)"/>
  <text x="630" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. धार्मिक रूढ़िवादिता एवं कर</text>
  <text x="630" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">• 1679 में जज़िया कर पुनः लागू किया</text>
  <path d="M 570 185 L 460 230" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Node 3: Anti-Sikh Policy -->
  <rect x="40" y="340" width="260" height="85" rx="10" fill="url(#slateGrad)"/>
  <text x="170" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. सिख विरोधी टकराव</text>
  <text x="170" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">• 1675 में गुरु तेग बहादुर का दिल्ली में वध</text>
  <path d="M 230 340 L 340 290" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Node 4: Anti-Maratha Policy -->
  <rect x="500" y="340" width="260" height="85" rx="10" fill="url(#slateGrad)"/>
  <text x="630" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. मराठा विरोधी निरंतर संघर्ष</text>
  <text x="630" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">• शंभाजी की क्रूर हत्या, छत्रपति शाहू बंदी</text>
  <path d="M 570 340 L 460 290" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
</svg>