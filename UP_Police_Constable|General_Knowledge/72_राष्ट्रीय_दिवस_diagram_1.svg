<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128807" />
      <stop offset="100%" stop-color="#0B5204" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000080" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Box 1: Independence -->
  <rect x="30" y="40" width="210" height="110" rx="12" fill="url(#saffron)" filter="url(#shadow)" />
  <text x="135" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">स्वतंत्रता दिवस</text>
  <text x="135" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFF3E0" text-anchor="middle">15 अगस्त 1947</text>
  <text x="135" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FFE0B2" text-anchor="middle">(संप्रभुता का प्रादुर्भाव)</text>

  <!-- Arrow 1 -->
  <path d="M 240 95 L 280 95" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Box 2: Constitution Adoption -->
  <rect x="295" y="40" width="210" height="110" rx="12" fill="url(#white)" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">संविधान दिवस</text>
  <text x="400" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#0F172A" text-anchor="middle">26 नवंबर 1949</text>
  <text x="400" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">(संविधान अंगीकृत)</text>

  <!-- Arrow 2 -->
  <path d="M 505 95 L 545 95" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- Box 3: Republic Day -->
  <rect x="560" y="40" width="210" height="110" rx="12" fill="url(#green)" filter="url(#shadow)" />
  <text x="665" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">गणतंत्र दिवस</text>
  <text x="665" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E8F5E9" text-anchor="middle">26 जनवरी 1950</text>
  <text x="665" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#C8E6C9" text-anchor="middle">(पूर्ण गणतंत्र की स्थापना)</text>

  <!-- Bottom Banner: Gandhi Jayanti -->
  <rect x="200" y="180" width="400" height="40" rx="8" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="400" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2 अक्टूबर: गांधी जयंती (नैतिक एवं वैचारिक आधार-स्तंभ)</text>
</svg>