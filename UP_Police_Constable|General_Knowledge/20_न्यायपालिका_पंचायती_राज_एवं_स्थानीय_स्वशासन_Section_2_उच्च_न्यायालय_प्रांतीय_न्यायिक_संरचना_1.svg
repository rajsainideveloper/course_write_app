<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="scGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="hcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="dcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <drop-shadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="15" />

  <!-- Supreme Court Box -->
  <rect x="250" y="30" width="300" height="70" rx="10" fill="url(#scGrad)" filter="url(#shadow)" />
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">सर्वोच्च न्यायालय (अनुच्छेद 124)</text>
  <text x="400" y="88" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">शीर्ष न्यायालय | सेवानिवृत्ति: 65 वर्ष</text>

  <!-- Connectors -->
  <path d="M 400 100 L 400 150" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 220 L 400 270" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- High Court Box -->
  <rect x="250" y="150" width="300" height="70" rx="10" fill="url(#hcGrad)" filter="url(#shadow)" />
  <text x="400" y="185" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">उच्च न्यायालय (अनुच्छेद 214)</text>
  <text x="400" y="208" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">राज्य प्रमुख न्यायालय | कुल: 25 | सेवानिवृत्ति: 62 वर्ष</text>

  <!-- District Court Box -->
  <rect x="250" y="270" width="300" height="70" rx="10" fill="url(#dcGrad)" filter="url(#shadow)" />
  <text x="400" y="305" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">अधीनस्थ / जिला न्यायालय (अनुच्छेद 233)</text>
  <text x="400" y="328" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">जिला एवं सत्र न्यायाधीश | दीवानी व आपराधिक मामले</text>
</svg>