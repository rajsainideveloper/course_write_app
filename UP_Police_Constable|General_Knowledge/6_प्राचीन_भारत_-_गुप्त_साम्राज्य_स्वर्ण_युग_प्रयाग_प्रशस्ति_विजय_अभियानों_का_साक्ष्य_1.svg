<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background Box -->
  <rect width="800" height="480" fill="#F8FAFC" rx="12" />

  <!-- SVG Main Title -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    समुद्रगुप्त की कूटनीतिक विजय नीतियां (सैन्य एवं भौगोलिक वर्गीकरण)
  </text>

  <!-- Central Core Concept -->
  <rect x="275" y="70" width="250" height="60" rx="10" fill="url(#goldGrad)" filter="url(#boxShadow)" />
  <text x="400" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">समुद्रगुप्त की दिग्विजय</text>
  <text x="400" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FEF3C7" text-anchor="middle">स्रोत: प्रयाग प्रशस्ति (हरिषेण)</text>

  <!-- Connectors -->
  <path d="M 275 100 L 140 100 L 140 160" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 130 L 400 160" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 525 100 L 660 100 L 660 160" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Left Column: Aryavarta -->
  <rect x="30" y="170" width="220" height="110" rx="8" fill="url(#royalBlue)" filter="url(#boxShadow)" />
  <text x="140" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">आर्यावर्त अभियान (उत्तर भारत)</text>
  <text x="140" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">• नीति: प्रसभोद्धरण</text>
  <text x="140" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">• राज्यों का समूल विनाश</text>
  <text x="140" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">• गुप्त साम्राज्य में सीधा विलय</text>

  <!-- Middle Column: Dakshinapatha -->
  <rect x="290" y="170" width="220" height="110" rx="8" fill="url(#royalBlue)" filter="url(#boxShadow)" />
  <text x="400" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">दक्षिणापथ अभियान (दक्षिण भारत)</text>
  <text x="400" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">• नीति: ग्रहण-मोक्षानुग्रह</text>
  <text x="400" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">• विजय के बाद कर लेकर</text>
  <text x="400" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">• राज्यों को पुनः मुक्त किया</text>

  <!-- Right Column: Frontier & Forest States -->
  <rect x="550" y="170" width="220" height="110" rx="8" fill="url(#royalBlue)" filter="url(#boxShadow)" />
  <text x="660" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">सीमावर्ती व आटविक राज्य</text>
  <text x="660" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">• नीति: परिचारकीकृत / करदान</text>
  <text x="660" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">• जंगली राज्यों को सेवक बनाना</text>
  <text x="660" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">• सीमांत राज्यों से कर वसूलना</text>

  <!-- Bottom Visual Info: Coins & Aswamedha -->
  <rect x="180" y="320" width="440" height="120" rx="10" fill="url(#emeraldGrad)" filter="url(#boxShadow)" />
  <text x="400" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">सांस्कृतिक एवं धार्मिक साक्ष्य</text>
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">1. अश्वमेध यज्ञ: विजय के उपरांत 'अश्वमेध पराक्रमः' सिक्कों का प्रचलन</text>
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">2. सिक्कों पर अंकन: समुद्रगुप्त को 'वीणा बजाते हुए' (संगीत प्रेमी) दिखाया गया</text>
</svg>