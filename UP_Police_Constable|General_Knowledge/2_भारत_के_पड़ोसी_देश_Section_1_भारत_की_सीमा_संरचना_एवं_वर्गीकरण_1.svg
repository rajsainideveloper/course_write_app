<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#F8FAFC" rx="15"/>
  
  <!-- Central Box -->
  <rect x="300" y="30" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">भारत की कुल सीमा संरचना</text>

  <!-- Connectors -->
  <path d="M 400 90 L 200 180" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 400 90 L 600 180" stroke="#94A3B8" stroke-width="2" fill="none"/>

  <!-- Left Box: Land Border -->
  <rect x="100" y="180" width="200" height="70" rx="10" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="200" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">स्थलीय सीमा</text>
  <text x="200" y="235" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">लंबाई: ~15,200 किमी (7 देश)</text>

  <!-- Right Box: Maritime Border -->
  <rect x="500" y="180" width="200" height="70" rx="10" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
  <text x="600" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">समुद्री / जलीय सीमा</text>
  <text x="600" y="235" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">कुल लंबाई: 7,516.6 किमी</text>

  <!-- Sub-details lower layer -->
  <path d="M 600 250 L 520 310" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 600 250 L 680 310" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

  <rect x="430" y="310" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1"/>
  <text x="505" y="330" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">मुख्य भूमि तटीय रेखा</text>
  <text x="505" y="348" fill="#0D9488" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">6,100 किमी</text>

  <rect x="620" y="310" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1"/>
  <text x="695" y="330" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">द्वीपों सहित तटीय रेखा</text>
  <text x="695" y="348" fill="#059669" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">7,516.6 किमी</text>
</svg>