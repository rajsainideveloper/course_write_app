<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Node 1: Infrastructure -->
  <rect x="50" y="40" width="200" height="90" rx="10" ry="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="150" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">बुलेट ट्रेन परियोजना</text>
  <text x="150" y="100" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">मुंबई-अहमदाबाद MAHSR</text>

  <!-- Node 2: Defense Exercises -->
  <rect x="300" y="40" width="200" height="90" rx="10" ry="10" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="400" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">सैन्य अभ्यास</text>
  <text x="400" y="100" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">धर्म गार्जियन, जिमेक्स, शिन्यू मैत्री</text>

  <!-- Node 3: Strategic Alliances -->
  <rect x="550" y="40" width="200" height="90" rx="10" ry="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="650" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">रणनीतिक मंच</text>
  <text x="650" y="100" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">QUAD एवं 2+2 वार्ता</text>

  <!-- Connector Lines to Central Box -->
  <path d="M 150 130 L 300 210" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 130 L 400 200" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 650 130 L 500 210" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Central Box -->
  <rect x="220" y="210" width="360" height="70" rx="10" ry="10" fill="#1E293B" filter="url(#shadow)"/>
  <text x="400" y="240" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">भारत-जापान रणनीतिक एवं आर्थिक स्तंभ</text>
  <text x="400" y="262" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">JICA वित्तपोषण एवं इंडो-पैसिफिक विजन</text>
</svg>