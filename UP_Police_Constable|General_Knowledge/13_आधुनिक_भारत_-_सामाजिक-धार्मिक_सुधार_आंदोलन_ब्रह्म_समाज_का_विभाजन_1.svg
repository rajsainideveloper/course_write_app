<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Root: Brahm Samaj -->
  <rect x="300" y="20" width="200" height="60" rx="10" ry="10" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ब्रह्म समाज (1828)</text>

  <!-- Connection to First Division -->
  <path d="M 400 80 L 400 130" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- First Division (1866) -->
  <text x="400" y="125" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" text-anchor="middle">प्रथम विभाजन (1866)</text>
  
  <path d="M 400 130 L 200 180" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 130 L 600 180" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Adi Brahm Samaj -->
  <rect x="100" y="180" width="200" height="60" rx="10" ry="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="200" y="205" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">आदि ब्रह्म समाज</text>
  <text x="200" y="228" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">नेतृत्व: देवेंद्रनाथ टैगोर</text>

  <!-- भारतीय ब्रह्म समाज -->
  <rect x="500" y="180" width="200" height="60" rx="10" ry="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="600" y="205" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">भारतीय ब्रह्म समाज</text>
  <text x="600" y="228" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">नेतृत्व: केशव चंद्र सेन</text>

  <!-- Connection to Second Division -->
  <path d="M 600 240 L 600 290" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="600" y="285" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" text-anchor="middle">द्वितीय विभाजन (1878)</text>

  <path d="M 600 290 L 450 340" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 600 290 L 750 340" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- साधारण ब्रह्म समाज -->
  <rect x="350" y="340" width="200" height="60" rx="10" ry="10" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  <text x="450" y="365" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">साधारण ब्रह्म समाज</text>
  <text x="450" y="388" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">आनंदमोहन बोस, शिबनाथ शास्त्री</text>

  <!-- नव विधान -->
  <rect x="650" y="340" width="140" height="60" rx="10" ry="10" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  <text x="720" y="365" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">नव विधान</text>
  <text x="720" y="388" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">के. सी. सेन (अवशेष)</text>
</svg>