<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <drop-shadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="15" />

  <!-- Main Header Box -->
  <rect x="250" y="20" width="300" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">राष्ट्रपति का निर्वाचक मंडल</text>

  <!-- Connectors -->
  <path d="M 400 80 L 400 130" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 400 130 L 120 130 L 120 180" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 130 L 400 180" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 130 L 680 130 L 680 180" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Box 1: Parliament -->
  <rect x="20" y="180" width="200" height="80" rx="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="120" y="215" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">संसद के दोनों सदन</text>
  <text x="120" y="240" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">केवल निर्वाचित सदस्य</text>

  <!-- Box 2: State Assemblies -->
  <rect x="300" y="180" width="200" height="80" rx="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="400" y="215" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">राज्यों की विधानसभाएँ</text>
  <text x="400" y="240" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">केवल निर्वाचित सदस्य</text>

  <!-- Box 3: UT Assemblies -->
  <rect x="580" y="180" width="200" height="80" rx="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="680" y="215" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">UT विधानसभाएँ</text>
  <text x="680" y="240" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">दिल्ली, पुडुचेरी व J&amp;K</text>

  <!-- Footnote Box -->
  <rect x="150" y="310" width="500" height="50" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1" />
  <text x="400" y="340" fill="#9F1239" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚠️ ध्यान दें: मनोनीत सदस्य एवं विधान परिषद के सदस्य शामिल नहीं होते।</text>
</svg>