<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="15" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="400" y="35" fill="#F8FAFC" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ध्वनि में डॉप्लर प्रभाव (Doppler Effect)</text>

  <!-- Moving Source (Siren/Ambulance) -->
  <g transform="translate(360, 160)" filter="url(#shadow)">
    <rect x="-40" y="-25" width="80" height="50" rx="10" fill="url(#sourceGrad)" />
    <text x="0" y="5" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ध्वनि स्रोत</text>
    <text x="0" y="22" fill="#FEF08A" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">गति ➔</text>
  </g>

  <!-- High Frequency Waves (Right side - Approaching) -->
  <path d="M 420 160 C 430 120, 440 120, 450 160 C 460 200, 470 200, 480 160 C 490 120, 500 120, 510 160 C 520 200, 530 200, 540 160" stroke="#38BDF8" stroke-width="3" fill="none"/>
  
  <!-- Low Frequency Waves (Left side - Receding) -->
  <path d="M 300 160 C 280 100, 260 100, 240 160 C 220 220, 200 220, 180 160 C 160 100, 140 100, 120 160" stroke="#F43F5E" stroke-width="3" fill="none"/>

  <!-- Observer A (Approaching side) -->
  <g transform="translate(620, 160)" filter="url(#shadow)">
    <rect x="-60" y="-35" width="120" height="70" rx="10" fill="url(#boxGrad)" />
    <text x="0" y="-10" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">श्रोता A (निकट)</text>
    <text x="0" y="10" fill="#38BDF8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">उच्च आवृत्ति ($f \uparrow$)</text>
    <text x="0" y="25" fill="#CBD5E1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">तीखी ध्वनि (High Pitch)</text>
  </g>

  <!-- Observer B (Receding side) -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect x="-60" y="-35" width="120" height="70" rx="10" fill="url(#boxGrad)" />
    <text x="0" y="-10" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">श्रोता B (दूर)</text>
    <text x="0" y="10" fill="#F43F5E" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">निम्न आवृत्ति ($f \downarrow$)</text>
    <text x="0" y="25" fill="#CBD5E1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">मंदी ध्वनि (Low Pitch)</text>
  </g>

  <!-- Summary Banner -->
  <rect x="100" y="280" width="600" height="45" rx="8" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="400" y="307" fill="#F1F5F9" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">स्रोत निकट आने पर: आवृत्ति ($\nu$) $\uparrow$ एवं तरंगदैर्ध्य ($\lambda$) $\downarrow$ \| दूर जाने पर: आवृत्ति ($\nu$) $\downarrow$ एवं तरंगदैर्ध्य ($\lambda$) $\uparrow$</text>
</svg>