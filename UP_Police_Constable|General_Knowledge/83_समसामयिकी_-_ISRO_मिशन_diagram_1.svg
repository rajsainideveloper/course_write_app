<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgGrad)"/>
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">चंद्रयान-3: मॉड्यूल एवं पेलोड संरचना</text>

  <!-- Level 1: Rocket -->
  <rect x="250" y="80" width="300" height="60" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="400" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">प्रक्षेपण यान: LVM3-M4 ("बाहुबली")</text>
  <text x="400" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">प्रक्षेपण तिथि: 14 जुलाई 2023 | श्रीहरिकोटा</text>

  <!-- Arrow down -->
  <path d="M 400 140 L 400 175" stroke="#94A3B8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 2: Propulsion Module & Lander Module -->
  <rect x="80" y="180" width="280" height="75" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="220" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">प्रोपल्शन मॉड्यूल (Propulsion Module)</text>
  <text x="220" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CCFBF1" text-anchor="middle">मुख्य पेलोड: SHAPE (पृथ्वी के अध्ययन हेतु)</text>

  <rect x="440" y="180" width="280" height="75" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="580" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">लैंडर मॉड्यूल (Lander - 'विक्रम')</text>
  <text x="580" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CCFBF1" text-anchor="middle">सफल सॉफ्ट लैंडिंग: 23 अगस्त 2023</text>

  <!-- Connectors from Rocket to Modules -->
  <path d="M 330 140 L 220 178" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 140 L 580 178" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrow down from Lander to Rover -->
  <path d="M 580 255 L 580 295" stroke="#94A3B8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 3: Rover -->
  <rect x="440" y="300" width="280" height="80" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="580" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">रोवर (Rover - 'प्रज्ञान')</text>
  <text x="580" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D1FAE5" text-anchor="middle">6-पहियों वाला वैज्ञानिक वाहन</text>
  <text x="580" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#D1FAE5" text-anchor="middle">पेलोड: APXS और LIBS (सल्फर की पुष्टि की)</text>
</svg>