<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%">
  <defs>
    <linearGradient id="eastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="westGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="400" y="35" fill="#1E293B" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">प्रायद्वीपीय अपवाह तंत्र का वर्गीकरण</text>
  <line x1="150" y1="50" x2="650" y2="50" stroke="#CBD5E1" stroke-width="2" />

  <!-- East Flowing -->
  <g transform="translate(60, 90)" filter="url(#boxShadow)">
    <rect width="320" height="220" rx="12" fill="url(#eastGrad)" />
    <text x="160" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">पूर्व की ओर बहने वाली (बंगाल की खाड़ी)</text>
    <line x1="30" y1="55" x2="290" y2="55" stroke="#93C5FD" stroke-width="1" />
    <text x="30" y="90" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• नदियाँ: गोदावरी, कृष्णा, महानदी, कावेरी</text>
    <text x="30" y="130" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• विशेषता: लंबे मार्ग, मंद ढाल, विस्तृत डेल्टा निर्माण</text>
    <text x="30" y="170" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• अपवाह: अपेक्षाकृत विशाल जलग्रहण क्षेत्र</text>
  </g>

  <!-- West Flowing -->
  <g transform="translate(420, 90)" filter="url(#boxShadow)">
    <rect width="320" height="220" rx="12" fill="url(#westGrad)" />
    <text x="160" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">पश्चिम की ओर बहने वाली (अरब सागर)</text>
    <line x1="30" y1="55" x2="290" y2="55" stroke="#99F6E4" stroke-width="1" />
    <text x="30" y="90" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• नदियाँ: नर्मदा, तापी, साबरमती, माही, पेरियार</text>
    <text x="30" y="130" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• विशेषता: भ्रंश घाटी (Rift Valley) में प्रवाह</text>
    <text x="30" y="170" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">• मुहाना: डेल्टा नहीं बनातीं, ज्वारनदमुख (Estuary) निर्माण</text>
  </g>
</svg>