<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Central Node -->
  <rect x="300" y="20" width="200" height="60" rx="10" ry="10" fill="url(#mainGrad)" filter="url(#shadow)"/>
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">भारत के पड़ोसी देश</text>

  <!-- Connectors -->
  <path d="M 400 80 L 220 160" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 80 L 580 160" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Land Neighbors Node -->
  <rect x="100" y="160" width="240" height="60" rx="10" ry="10" fill="url(#landGrad)" filter="url(#shadow)"/>
  <text x="220" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">स्थल सीमा से सटे देश (7)</text>

  <!-- Maritime Neighbors Node -->
  <rect x="460" y="160" width="240" height="60" rx="10" ry="10" fill="url(#seaGrad)" filter="url(#shadow)"/>
  <text x="580" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">जल/समुद्री सीमा से सटे देश</text>

  <!-- Sub Details -->
  <text x="220" y="250" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">बांग्लादेश, चीन, पाकिस्तान, नेपाल,</text>
  <text x="220" y="270" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">म्यांमार, भूटान, अफगानिस्तान</text>

  <text x="580" y="250" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">श्रीलंका, मालदीव</text>
</svg>