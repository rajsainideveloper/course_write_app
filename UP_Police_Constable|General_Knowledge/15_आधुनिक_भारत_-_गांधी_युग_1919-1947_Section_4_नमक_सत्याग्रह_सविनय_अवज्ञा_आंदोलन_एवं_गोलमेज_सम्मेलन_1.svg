<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Title Section -->
  <rect x="220" y="15" width="360" height="50" rx="8" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="46" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">दांडी मार्च एवं सविनय अवज्ञा आंदोलन (1930)</text>

  <!-- Connectors -->
  <path d="M 400 65 L 400 110" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 170 L 400 215" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 275 L 400 320" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Step 1 -->
  <rect x="120" y="110" width="560" height="60" rx="10" ry="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="400" y="135" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">प्रारंभ: 12 मार्च 1930 (साबरमती आश्रम से प्रस्थान)</text>
  <text x="400" y="155" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">गांधीजी अपने 78 विश्वसनीय स्वयंसेवकों के साथ पैदल यात्रा पर निकले</text>

  <!-- Step 2 -->
  <rect x="120" y="215" width="560" height="60" rx="10" ry="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="400" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">यात्रा विवरण: 24 दिनों में 240 मील (लगभग 385 किमी) की दूरी तय की</text>
  <text x="400" y="260" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">मार्ग में हजारों आम नागरिकों का जुड़ाव, आंदोलन का वैश्विक मीडिया में प्रसार</text>

  <!-- Step 3 -->
  <rect x="120" y="320" width="560" height="60" rx="10" ry="10" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  <text x="400" y="345" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">समापन: 6 अप्रैल 1930 (दांडी तट, गुजरात)</text>
  <text x="400" y="365" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">गांधीजी ने मुट्ठी भर नमक बनाकर कानून का उल्लंघन किया; सविनय अवज्ञा आंदोलन देशव्यापी शुरू</text>

  <!-- Summary Box -->
  <rect x="120" y="400" width="560" height="50" rx="8" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="400" y="430" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">विशेष बिंदु: तमिलनाडु में सी. राजगोपालाचारी ने तिरुचिरापल्ली से वेदारण्यम तक नमक यात्रा निकाली थी।</text>
</svg>