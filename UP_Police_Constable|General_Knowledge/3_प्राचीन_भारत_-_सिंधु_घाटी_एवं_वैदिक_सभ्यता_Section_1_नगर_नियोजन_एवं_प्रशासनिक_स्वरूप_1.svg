<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#F1F5F9" rx="10"/>
  
  <!-- Grid representation -->
  <path d="M 100 50 L 100 350 M 250 50 L 250 350 M 400 50 L 400 350 M 550 50 L 550 350" stroke="#94A3B8" stroke-width="4"/>
  <path d="M 50 100 L 750 100 M 50 225 L 750 225 M 50 350 L 750 350" stroke="#94A3B8" stroke-width="4"/>

  <!-- Blocks representing houses -->
  <rect x="120" y="120" width="110" height="85" rx="5" fill="url(#gridGrad)" filter="url(#shadow)"/>
  <rect x="270" y="120" width="110" height="85" rx="5" fill="url(#gridGrad)" filter="url(#shadow)"/>
  <rect x="120" y="250" width="110" height="85" rx="5" fill="url(#gridGrad)" filter="url(#shadow)"/>
  
  <text x="400" y="380" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">सिंधु सभ्यता का ग्रिड पैटर्न (Grid System)</text>
</svg>