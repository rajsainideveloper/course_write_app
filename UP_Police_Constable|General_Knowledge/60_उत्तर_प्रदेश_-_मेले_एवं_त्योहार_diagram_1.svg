<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Box -->
  <rect x="200" y="20" width="400" height="50" rx="10" fill="url(#gradMain)" filter="url(#shadow)"/>
  <text x="400" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">उत्तर प्रदेश के प्रमुख सांस्कृतिक उत्सव क्षेत्र</text>

  <!-- Central Node -->
  <rect x="300" y="120" width="200" height="45" rx="8" fill="#1E3A8A" filter="url(#shadow)"/>
  <text x="400" y="142" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dy=".3em">सांस्कृतिक अंचल (Cultural Zones)</text>

  <!-- Connectors -->
  <path d="M 350 165 L 150 240" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 165 L 400 240" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450 165 L 650 240" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Left Branch -->
  <rect x="50" y="245" width="200" height="120" rx="10" fill="url(#gradBox)" filter="url(#shadow)"/>
  <text x="150" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">बज क्षेत्र (Braij Region)</text>
  <text x="150" y="300" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• कंस वध मेला (मथुरा)</text>
  <text x="150" y="320" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• हरिदास जयंती (वृंदावन)</text>
  <text x="150" y="340" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• लठमार होली (बरसाना)</text>

  <!-- Middle Branch -->
  <rect x="300" y="245" width="200" height="120" rx="10" fill="url(#gradBox)" filter="url(#shadow)"/>
  <text x="400" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">अवध व पूर्वांचल (Awadh/Purvanchal)</text>
  <text x="400" y="300" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• रामनवमी मेला (अयोध्या)</text>
  <text x="400" y="320" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• खिचड़ी मेला (गोरखपुर)</text>
  <text x="400" y="340" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• देवा शरीफ (बाराबंकी)</text>

  <!-- Right Branch -->
  <rect x="550" y="245" width="200" height="120" rx="10" fill="url(#gradBox)" filter="url(#shadow)"/>
  <text x="650" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">बुंदेलखंड व पश्चिमी UP</text>
  <text x="650" y="300" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• कलिंजर मेला (बांदा)</text>
  <text x="650" y="320" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• नौचंदी मेला (मेरठ)</text>
  <text x="650" y="340" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">• बटेश्वर मेला (आगरा)</text>
</svg>