<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="parlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="lsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="rsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background Structure -->
  <rect width="100%" height="100%" fill="#F1F5F9" rx="12" />

  <!-- Main Parliament Box -->
  <rect x="250" y="20" width="300" height="60" rx="10" fill="url(#parlGrad)" filter="url(#dropShadow)" />
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">भारतीय संसद (अनुच्छेद 79)</text>

  <!-- Connectors -->
  <path d="M 400 80 L 400 120" stroke="#64748B" stroke-width="2" fill="none" />
  <path d="M 400 120 L 140 120 L 140 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 120 L 660 120 L 660 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Lok Sabha Card -->
  <rect x="30" y="160" width="220" height="220" rx="10" fill="url(#lsGrad)" filter="url(#dropShadow)" />
  <text x="140" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">लोकसभा (निचला सदन)</text>
  <line x1="50" y1="210" x2="230" y2="210" stroke="#E2E8F0" stroke-width="1" />
  <text x="50" y="240" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• अधिकतम संख्या:</text>
  <text x="170" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">550</text>
  <text x="50" y="270" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• वर्तमान संख्या:</text>
  <text x="170" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">543</text>
  <text x="50" y="300" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• चुनाव विधि:</text>
  <text x="170" y="300" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">प्रत्यक्ष</text>
  <text x="50" y="330" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• सामान्य कार्यकाल:</text>
  <text x="170" y="330" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">5 वर्ष</text>

  <!-- Rajya Sabha Card -->
  <rect x="550" y="160" width="220" height="220" rx="10" fill="url(#rsGrad)" filter="url(#dropShadow)" />
  <text x="660" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">राज्यसभा (उच्च सदन)</text>
  <line x1="570" y1="210" x2="750" y2="210" stroke="#E2E8F0" stroke-width="1" />
  <text x="570" y="240" fill="#E6FFFA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• अधिकतम संख्या:</text>
  <text x="690" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">250</text>
  <text x="570" y="270" fill="#E6FFFA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• वर्तमान संख्या:</text>
  <text x="690" y="270" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">245</text>
  <text x="570" y="300" fill="#E6FFFA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• चुनाव विधि:</text>
  <text x="690" y="300" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">अप्रत्यक्ष</text>
  <text x="570" y="330" fill="#E6FFFA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">• सदन का स्वरूप:</text>
  <text x="690" y="330" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">स्थायी (6 वर्ष)</text>
</svg>