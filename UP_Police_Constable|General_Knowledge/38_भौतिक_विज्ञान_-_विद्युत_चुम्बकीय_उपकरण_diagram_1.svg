<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" rx="15" fill="url(#bgGrad)"/>
  
  <text x="400" y="35" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">विद्युत चुम्बक की संरचना (Structure of an Electromagnet)</text>

  <!-- Soft Iron Core -->
  <rect x="200" y="120" width="400" height="60" rx="10" fill="url(#coreGrad)" filter="url(#dropShadow)"/>
  <text x="400" y="155" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">नर्म लोहे का क्रोड (Soft Iron Core)</text>

  <!-- Coil Windings -->
  <g fill="none" stroke="url(#wireGrad)" stroke-width="12" stroke-linecap="round">
    <path d="M 230,110 C 220,110 220,190 230,190"/>
    <path d="M 270,110 C 260,110 260,190 270,190"/>
    <path d="M 310,110 C 300,110 300,190 310,190"/>
    <path d="M 350,110 C 340,110 340,190 350,190"/>
    <path d="M 390,110 C 380,110 380,190 390,190"/>
    <path d="M 430,110 C 420,110 420,190 430,190"/>
    <path d="M 470,110 C 460,110 460,190 470,190"/>
    <path d="M 510,110 C 500,110 500,190 510,190"/>
    <path d="M 550,110 C 540,110 540,190 550,190"/>
  </g>

  <!-- Polarity Labels -->
  <text x="160" y="155" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle"> उत्तरी ध्रुव (N)</text>
  <text x="640" y="155" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">दक्षिणी ध्रुव (S)</text>

  <!-- Circuit Connections -->
  <path d="M 230,190 L 230,260 L 330,260" stroke="#F59E0B" stroke-width="4" fill="none"/>
  <path d="M 550,190 L 550,260 L 470,260" stroke="#F59E0B" stroke-width="4" fill="none"/>

  <!-- Battery Box -->
  <rect x="330" y="235" width="140" height="50" rx="8" fill="url(#boxGrad)" stroke="#38BDF8" stroke-width="2"/>
  <text x="400" y="265" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">DC बैटरी (Battery)</text>

  <!-- Current Direction Arrows -->
  <path d="M 260,260 L 280,260" stroke="#38BDF8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="315" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">धारा की तीव्रता (I) तथा फेरों की संख्या (N) बढ़ाने पर चुम्बकीय सामर्थ्य बढ़ती है।</text>
</svg>