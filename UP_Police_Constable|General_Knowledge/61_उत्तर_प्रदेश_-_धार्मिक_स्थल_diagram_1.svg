<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="350" rx="15" fill="url(#bgGrad)"/>

  <!-- Title Inside SVG -->
  <text x="400" y="40" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">अयोध्या धार्मिक एवं सांस्कृतिक परिपथ (Ayodhya Circuit)</text>

  <!-- Central Hub -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="400" y="105" fill="#1E3A8A" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">सरयू तट (अयोध्या)</text>
  <text x="400" y="125" fill="#0D9488" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">पवित्र स्नान एवं दीपदान</text>

  <!-- Node 1: Ram Mandir -->
  <rect x="50" y="210" width="200" height="70" rx="10" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="150" y="235" fill="#1E3A8A" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">श्री राम जन्मभूमि मंदिर</text>
  <text x="150" y="255" fill="#64748B" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">नागर शैली (चंद्रकांत सोमपुरा)</text>

  <!-- Node 2: Hanuman Garhi -->
  <rect x="300" y="210" width="200" height="70" rx="10" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="400" y="235" fill="#1E3A8A" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">हनुमान गढ़ी</text>
  <text x="400" y="255" fill="#64748B" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">76 सीढ़ियाँ, टीले पर स्थित</text>

  <!-- Node 3: Dhannipur Mosque -->
  <rect x="550" y="210" width="200" height="70" rx="10" fill="url(#boxGrad)" filter="url(#shadow)"/>
  <text x="650" y="235" fill="#1E3A8A" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">धन्नीपुर मस्जिद स्थल</text>
  <text x="650" y="255" fill="#64748B" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">इंडो-इस्लामिक सांस्कृतिक केंद्र</text>

  <!-- Arrows -->
  <path d="M 350 140 L 200 210" stroke="#CBD5E1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 210" stroke="#CBD5E1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450 140 L 600 210" stroke="#CBD5E1" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>