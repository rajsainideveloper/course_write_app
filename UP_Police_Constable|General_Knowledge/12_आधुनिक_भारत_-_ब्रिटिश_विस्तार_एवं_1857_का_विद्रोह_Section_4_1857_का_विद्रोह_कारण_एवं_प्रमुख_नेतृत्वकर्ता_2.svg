<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#991B1B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <filter id="sd">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Central Title -->
  <rect x="250" y="20" width="300" height="50" rx="10" fill="url(#mainGrad)" filter="url(#sd)"/>
  <text x="400" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1857 के विद्रोह के बहुआयामी कारण</text>

  <!-- Military Cause -->
  <rect x="50" y="120" width="320" height="70" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="2" filter="url(#sd)"/>
  <text x="70" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991B1B">1. सैन्य कारण</text>
  <text x="70" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">चर्बीयुक्त कारतूस (सैनिकों का धर्म भ्रष्ट करना), डाकघर अधिनियम।</text>

  <!-- Economic Cause -->
  <rect x="430" y="120" width="320" height="70" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="2" filter="url(#sd)"/>
  <text x="450" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991B1B">2. आर्थिक कारण</text>
  <text x="450" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">अत्यधिक भू-राजस्व दरें, पारंपरिक हस्तशिल्प उद्योगों का विनाश।</text>

  <!-- Political Cause -->
  <rect x="50" y="230" width="320" height="70" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="2" filter="url(#sd)"/>
  <text x="70" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991B1B">3. राजनीतिक व प्रशासनिक कारण</text>
  <text x="70" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">डलहौजी की हड़प नीति, अवध का कुशासन के आधार पर विलय।</text>

  <!-- Social-Religious Cause -->
  <rect x="430" y="230" width="320" height="70" rx="8" fill="#F8FAFC" stroke="#DC2626" stroke-width="2" filter="url(#sd)"/>
  <text x="450" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991B1B">4. सामाजिक-धार्मिक कारण</text>
  <text x="450" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">सती प्रथा उन्मूलन (1829), हिंदू विधवा पुनर्विवाह (1856)।</text>

  <!-- Immediate Cause -->
  <rect x="200" y="350" width="400" height="80" rx="10" fill="url(#c1)" filter="url(#sd)"/>
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">तत्कालिक कारण: एनफील्ड राइफल (Enfield Rifle)</text>
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FEE2E2" text-anchor="middle">गाय और सूअर की चर्बी वाले कारतूसों का प्रयोग अनिवार्य करना।</text>

  <!-- Connection Lines -->
  <path d="M 250 45 L 210 45 L 210 120" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 550 45 L 590 45 L 590 120" stroke="#94A3B8" stroke-width="2" fill="none"/>
</svg>