<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="15" ry="15" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उत्तर प्रदेश: चार सुदूरतम बिंदु (Extreme Points)</text>

  <!-- North Point -->
  <g filter="url(#shadow)">
    <rect x="300" y="80" width="200" height="55" rx="10" ry="10" fill="url(#boxGrad)"/>
    <text x="400" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उत्तरी बिंदु (North)</text>
    <text x="400" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FDE047" text-anchor="middle">सहारनपुर (Saharanpur)</text>
  </g>

  <!-- West Point -->
  <g filter="url(#shadow)">
    <rect x="60" y="180" width="200" height="55" rx="10" ry="10" fill="url(#boxGrad)"/>
    <text x="160" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">पश्चिमी बिंदु (West)</text>
    <text x="160" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FDE047" text-anchor="middle">शामली (Shamli)</text>
  </g>

  <!-- East Point -->
  <g filter="url(#shadow)">
    <rect x="540" y="180" width="200" height="55" rx="10" ry="10" fill="url(#boxGrad)"/>
    <text x="640" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">पूर्वी बिंदु (East)</text>
    <text x="640" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FDE047" text-anchor="middle">बलिया (Ballia)</text>
  </g>

  <!-- South Point -->
  <g filter="url(#shadow)">
    <rect x="300" y="280" width="200" height="55" rx="10" ry="10" fill="url(#boxGrad)"/>
    <text x="400" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">दक्षिणी बिंदु (South)</text>
    <text x="400" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FDE047" text-anchor="middle">सोनभद्र (Sonbhadra)</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="400" y1="135" x2="400" y2="280" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="260" y1="207" x2="540" y2="207" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,6"/>

  <circle cx="400" cy="207" r="8" fill="#F87171"/>
  <text x="400" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">पूर्व से पश्चिम विस्तार: 650 किमी | उत्तर से दक्षिण विस्तार: 240 किमी</text>
</svg>