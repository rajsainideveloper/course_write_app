<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="gradSub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">हिंदी व्याकरण में काल का वर्गीकरण</text>

  <!-- Root Node -->
  <rect x="300" y="70" width="200" height="50" rx="10" fill="url(#gradMain)" filter="url(#shadow)"/>
  <text x="400" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">काल (Tense)</text>

  <!-- Connectors from Root to Branches -->
  <path d="M 400 120 L 400 160 L 150 160 L 150 190" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 120 L 400 190" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 120 L 400 160 L 650 160 L 650 190" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Branch 1: भूतकाल -->
  <rect x="60" y="190" width="180" height="45" rx="8" fill="url(#gradSub)" filter="url(#shadow)"/>
  <text x="150" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">भूतकाल (Past)</text>

  <!-- Branch 2: वर्तमान काल -->
  <rect x="310" y="190" width="180" height="45" rx="8" fill="url(#gradSub)" filter="url(#shadow)"/>
  <text x="400" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">वर्तमान काल (Present)</text>

  <!-- Branch 3: भविष्यकाल -->
  <rect x="560" y="190" width="180" height="45" rx="8" fill="url(#gradSub)" filter="url(#shadow)"/>
  <text x="650" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">भविष्यकाल (Future)</text>

  <!-- Sub-branches Connectors -->
  <!-- भूतकाल Sub-nodes -->
  <path d="M 150 235 L 150 260" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 60 260 L 240 260" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 60 260 L 60 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 105 260 L 105 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 150 260 L 150 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 195 260 L 195 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 240 260 L 240 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- वर्तमान काल Sub-nodes -->
  <path d="M 400 235 L 400 260" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 315 260 L 485 260" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 315 260 L 315 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 357 260 L 357 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 260 L 400 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 442 260 L 442 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 485 260 L 485 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- भविष्यकाल Sub-nodes -->
  <path d="M 650 235 L 650 260" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 590 260 L 710 260" stroke="#64748B" stroke-width="2" fill="none"/>
  <path d="M 590 260 L 590 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 650 260 L 650 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 710 260 L 710 285" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Sub-node Labels (भूतकाल: सामान्य, अपूर्ण, पूर्ण, संदिग्ध, आसन्न) -->
  <rect x="40" y="285" width="40" height="150" rx="5" fill="#1E3A8A" opacity="0.1"/>
  <text x="60" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1E3A8A" text-anchor="middle" transform="rotate(-90 60 360)">सामान्य, अपूर्ण, पूर्ण,</text>
  <text x="60" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1E3A8A" text-anchor="middle">संदिग्ध, आसन्न</text>

  <rect x="85" y="285" width="40" height="150" rx="5" fill="#0D9488" opacity="0.1"/>
  <text x="105" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0D9488" text-anchor="middle" transform="rotate(-90 105 360)">सामान्य, अपूर्ण, पूर्ण,</text>

  <rect x="295" y="285" width="40" height="150" rx="5" fill="#059669" opacity="0.1"/>
  <text x="315" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#059669" text-anchor="middle" transform="rotate(-90 315 360)">सामान्य, तात्कालिक,</text>

  <rect x="570" y="285" width="40" height="150" rx="5" fill="#1E3A8A" opacity="0.1"/>
  <text x="590" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1E3A8A" text-anchor="middle" transform="rotate(-90 590 360)">सामान्य, संभाव्य, निश्चित</text>

</svg>