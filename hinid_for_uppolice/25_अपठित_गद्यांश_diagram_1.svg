<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#F8FAFC" rx="15"/>

  <!-- Step 1 -->
  <g transform="translate(50, 80)" filter="url(#shadow)">
    <rect width="180" height="220" rx="12" fill="url(#grad1)"/>
    <text x="90" y="40" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">चरण 1</text>
    <text x="90" y="80" fill="#FFFFFF" font-size="14" text-anchor="middle">शीघ्र पठन</text>
    <text x="90" y="110" fill="#E2E8F0" font-size="12" text-anchor="middle">(Skimming)</text>
    <foreignObject x="15" y="130" width="150" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #F1F5F9; font-size: 11px; text-align: center; font-family: sans-serif;">गद्यांश पर सरसरी निगाह डालें और केंद्रीय विषय को समझें।</div>
    </foreignObject>
  </g>

  <path d="M 235 190 L 295 190" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(310, 80)" filter="url(#shadow)">
    <rect width="180" height="220" rx="12" fill="url(#grad2)"/>
    <text x="90" y="40" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">चरण 2</text>
    <text x="90" y="80" fill="#FFFFFF" font-size="14" text-anchor="middle">प्रश्न विश्लेषण</text>
    <text x="90" y="110" fill="#E2E8F0" font-size="12" text-anchor="middle">(Question Mapping)</text>
    <foreignObject x="15" y="130" width="150" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #F1F5F9; font-size: 11px; text-align: center; font-family: sans-serif;">प्रश्नों को पढ़कर गद्यांश में उनके संभावित उत्तरों को रेखांकित करें।</div>
    </foreignObject>
  </g>

  <path d="M 495 190 L 555 190" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(570, 80)" filter="url(#shadow)">
    <rect width="180" height="220" rx="12" fill="url(#grad1)"/>
    <text x="90" y="40" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">चरण 3</text>
    <text x="90" y="80" fill="#FFFFFF" font-size="14" text-anchor="middle">सटीक उत्तर चयन</text>
    <text x="90" y="110" fill="#E2E8F0" font-size="12" text-anchor="middle">(Precise Selection)</text>
    <foreignObject x="15" y="130" width="150" height="70">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #F1F5F9; font-size: 11px; text-align: center; font-family: sans-serif;">विकल्पों का मूल्यांकन कर सबसे प्रामाणिक उत्तर चुनें।</div>
    </foreignObject>
  </g>
</svg>