<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>
  
  <!-- Central Concept -->
  <rect x="300" y="170" width="200" height="60" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="400" y="205" font-family="system-ui, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">पर्यायवाची शब्द</text>
  
  <!-- Connections -->
  <path d="M 300 200 L 150 100" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 200 L 650 100" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 300 200 L 150 300" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 200 L 650 300" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Nodes -->
  <rect x="50" y="70" width="120" height="40" rx="5" ry="5" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1" />
  <text x="110" y="95" font-family="system-ui, sans-serif" font-size="14" fill="#1E3A8A" text-anchor="middle">भाषिक विविधता</text>
  
  <rect x="630" y="70" width="120" height="40" rx="5" ry="5" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1" />
  <text x="690" y="95" font-family="system-ui, sans-serif" font-size="14" fill="#1E3A8A" text-anchor="middle">शब्द भंडार वृद्धि</text>
  
  <rect x="50" y="280" width="120" height="40" rx="5" ry="5" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1" />
  <text x="110" y="305" font-family="system-ui, sans-serif" font-size="14" fill="#1E3A8A" text-anchor="middle">भाव प्रकटीकरण</text>
  
  <rect x="630" y="280" width="120" height="40" rx="5" ry="5" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="1" />
  <text x="690" y="305" font-family="system-ui, sans-serif" font-size="14" fill="#1E3A8A" text-anchor="middle">लेखन कौशल</text>
</svg>