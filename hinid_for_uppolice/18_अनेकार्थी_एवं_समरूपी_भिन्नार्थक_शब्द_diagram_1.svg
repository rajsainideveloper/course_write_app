<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="15"/>
  
  <!-- Central Node -->
  <g transform="translate(330, 135)" filter="url(#shadow)">
    <rect width="140" height="80" rx="12" fill="url(#blueGrad)"/>
    <text x="70" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">शब्द: 'कनक'</text>
  </g>

  <!-- Branch 1 -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <rect width="150" height="60" rx="8" fill="url(#tealGrad)"/>
    <text x="75" y="35" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">अर्थ 1: सोना (Gold)</text>
  </g>

  <!-- Branch 2 -->
  <g transform="translate(590, 40)" filter="url(#shadow)">
    <rect width="150" height="60" rx="8" fill="url(#tealGrad)"/>
    <text x="75" y="35" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">अर्थ 2: धतूरा</text>
  </g>

  <!-- Branch 3 -->
  <g transform="translate(60, 240)" filter="url(#shadow)">
    <rect width="150" height="60" rx="8" fill="url(#tealGrad)"/>
    <text x="75" y="35" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">अर्थ 3: गेहूँ</text>
  </g>

  <!-- Branch 4 -->
  <g transform="translate(590, 240)" filter="url(#shadow)">
    <rect width="150" height="60" rx="8" fill="url(#tealGrad)"/>
    <text x="75" y="35" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">अर्थ 4: पलाश</text>
  </g>

  <!-- Connectors -->
  <path d="M 330 155 L 210 80" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 155 L 590 80" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 330 195 L 210 260" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 195 L 590 260" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>