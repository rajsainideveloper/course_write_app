<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#F8FAFC" rx="12"/>
  
  <!-- Root Box -->
  <rect x="300" y="30" width="200" height="60" rx="10" fill="url(#primaryGrad)"/>
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">क्रिया (Verb)</text>

  <!-- Connectors from Root -->
  <path d="M 400 90 L 400 130" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Main Categories Box -->
  <rect x="250" y="130" width="300" height="50" rx="8" fill="#E2E8F0"/>
  <text x="400" y="155" fill="#1E293B" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" dy=".3em">आधारभूत वर्गीकरण (Classification)</text>

  <!-- Branches -->
  <path d="M 330 180 L 180 230" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 180 L 400 230" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 180 L 620 230" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Subcategories -->
  <rect x="80" y="230" width="200" height="60" rx="8" fill="url(#subGrad)"/>
  <text x="180" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dy=".3em">कर्म के आधार पर</text>
  <text x="180" y="280" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" dy=".3em">(सकर्मक / अकर्मक)</text>

  <rect x="300" y="230" width="200" height="60" rx="8" fill="url(#subGrad)"/>
  <text x="400" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dy=".3em">रचना/बनावट के आधार पर</text>
  <text x="400" y="280" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" dy=".3em">(पूर्वकालिक, नामधातु आदि)</text>

  <rect x="520" y="230" width="200" height="60" rx="8" fill="url(#subGrad)"/>
  <text x="620" y="260" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dy=".3em">प्रयोग के आधार पर</text>
  <text x="620" y="280" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" dy=".3em">(मुख्य एवं सहायक)</text>
</svg>