<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="12" ry="12"/>

  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1E3A8A" text-anchor="middle">संस्कृत उपसर्ग संरचना प्रवाह</text>

  <!-- Box 1 -->
  <rect x="50" y="70" width="200" height="80" rx="10" ry="10" fill="url(#blueGrad)" />
  <text x="150" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">प्र, परा, अप, सम्</text>
  <text x="150" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">उत्कृष्टता या हीनता बोधक</text>

  <!-- Box 2 -->
  <rect x="300" y="70" width="200" height="80" rx="10" ry="10" fill="url(#tealGrad)" />
  <text x="400" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">अनु, अव, निर्, दुर्</text>
  <text x="400" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">क्रम, अभाव या कठिनाई</text>

  <!-- Box 3 -->
  <rect x="550" y="70" width="200" height="80" rx="10" ry="10" fill="url(#blueGrad)" />
  <text x="650" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">वि, आ, नि, अधि</text>
  <text x="650" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">विशेषता, सीमा या श्रेष्ठता</text>

  <!-- Connecting Line -->
  <path d="M 400 160 L 400 200" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Bottom Box -->
  <rect x="200" y="210" width="400" height="90" rx="10" ry="10" fill="#059669" />
  <text x="400" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">सु, उत्, अभि, प्रति, परि, उप</text>
  <text x="400" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ECFDF5" text-anchor="middle">समग्र शब्द निर्माण (सुगम, उत्पन्न, अभिमान, प्रतिदिन आदि)</text>
</svg>