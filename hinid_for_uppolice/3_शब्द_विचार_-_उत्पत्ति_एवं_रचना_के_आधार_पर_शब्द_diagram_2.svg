<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="structGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <rect x="220" y="20" width="360" height="45" rx="6" fill="url(#structGrad)" filter="url(#shadow2)"/>
  <text x="400" y="43" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">रचना / बनावट के आधार पर शब्द भेद</text>

  <!-- 3 Categories -->
  <!-- 1. रूढ़ -->
  <rect x="80" y="110" width="180" height="150" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow2)"/>
  <text x="170" y="145" fill="#059669" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">रूढ़ शब्द</text>
  <line x1="100" y1="160" x2="240" y2="160" stroke="#E2E8F0" stroke-width="2"/>
  <text x="170" y="190" fill="#334155" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">सार्थक खंड संभव नहीं</text>
  <text x="170" y="215" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">उदा: पानी, रोटी, कल</text>

  <!-- 2. यौगिक -->
  <rect x="310" y="110" width="180" height="150" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow2)"/>
  <text x="400" y="145" fill="#059669" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">यौगिक शब्द</text>
  <line x1="330" y1="160" x2="470" y2="160" stroke="#E2E8F0" stroke-width="2"/>
  <text x="400" y="190" fill="#334155" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">उपसर्ग/प्रत्यय/मेल से</text>
  <text x="400" y="215" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">उदा: दयालु, विद्यालय</text>

  <!-- 3. योगरूढ़ -->
  <rect x="540" y="110" width="180" height="150" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow2)"/>
  <text x="630" y="145" fill="#059669" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">योगरूढ़ शब्द</text>
  <line x1="560" y1="160" x2="700" y2="160" stroke="#E2E8F0" stroke-width="2"/>
  <text x="630" y="190" fill="#334155" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">विशेष अर्थ प्रदान करें</text>
  <text x="630" y="215" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">उदा: पंकज, दशानन</text>
</svg>