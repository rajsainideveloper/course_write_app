<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" rx="15" ry="15"/>

  <!-- Center Node -->
  <rect x="300" y="30" width="200" height="60" rx="10" ry="10" fill="url(#nodeGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">विराम चिह्न (Punctuation)</text>

  <!-- Branch 1: Purna Viram -->
  <path d="M 350 90 L 150 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="70" y="160" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="150" y="185" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">पूर्ण विराम (۔)</text>
  <text x="150" y="202" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">वाक्य के अंत में</text>

  <!-- Branch 2: Alp Viram -->
  <path d="M 380 90 L 300 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="250" y="160" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="330" y="185" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">अल्प विराम (,)</text>
  <text x="330" y="202" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">थोड़ी देर रुकने के लिए</text>

  <!-- Branch 3: Prashan Vachak -->
  <path d="M 420 90 L 500 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="430" y="160" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="510" y="185" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">प्रश्नवाचक (?)</text>
  <text x="510" y="202" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">प्रश्न पूछने के लिए</text>

  <!-- Branch 4: Vismayadibodhaka -->
  <path d="M 450 90 L 650 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="600" y="160" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="680" y="185" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">विस्मयादिबोधक (!)</text>
  <text x="680" y="202" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">आश्चर्य/हर्ष/शोक</text>

  <!-- Lower Row -->
  <!-- Branch 5: Yojak Chinh -->
  <path d="M 380 90 L 200 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="120" y="280" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="200" y="305" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">योजक चिह्न (-)</text>
  <text x="200" y="322" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">शब्दों को जोड़ने हेतु</text>

  <!-- Branch 6: Uddharan Chinh -->
  <path d="M 400 90 L 380 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="300" y="280" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="380" y="305" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">उद्धरण चिह्न (' ')</text>
  <text x="380" y="322" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">वक्ता का कथन</text>

  <!-- Branch 7: Ardh Viram -->
  <path d="M 420 90 L 560 280" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480" y="280" width="160" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="560" y="305" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">अर्द्ध विराम (;)</text>
  <text x="560" y="322" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">मुख्य उपवाक्य अंत</text>

  <!-- Footer Info Box -->
  <rect x="200" y="380" width="400" height="80" rx="10" ry="10" fill="#1E3A8A" opacity="0.05"/>
  <rect x="200" y="380" width="400" height="80" rx="10" ry="10" fill="none" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="400" y="410" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">परीक्षा दृष्टि (Exam Focus)</text>
  <text x="400" y="435" fill="#334155" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">कामाप्रसाद गुरु ने कुल 20 विराम चिह्न माने हैं जिनमें 'पूर्ण विराम' हिंदी का है।</text>
</svg>