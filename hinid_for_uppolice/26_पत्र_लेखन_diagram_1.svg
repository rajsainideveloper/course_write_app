<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="15" fill="#F8FAFC"/>

  <!-- Main Title -->
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">पत्रों के मुख्य प्रकार (Types of Letters)</text>

  <!-- Central Root Node -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">पत्र के प्रकार</text>

  <!-- Branch 1: Formal -->
  <rect x="80" y="220" width="180" height="70" rx="10" fill="url(#secondaryGrad)" filter="url(#shadow)"/>
  <text x="170" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">औपचारिक पत्र</text>
  <text x="170" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">(Formal Letters)</text>

  <!-- Branch 2: Informal -->
  <rect x="310" y="220" width="180" height="70" rx="10" fill="url(#secondaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">अनौपचारिक पत्र</text>
  <text x="400" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">(Informal Letters)</text>

  <!-- Branch 3: Semi-Formal -->
  <rect x="540" y="220" width="180" height="70" rx="10" fill="url(#secondaryGrad)" filter="url(#shadow)"/>
  <text x="630" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">अर्द्धऔपचारिक पत्र</text>
  <text x="630" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">(Semi-Formal)</text>

  <!-- Connectors from Root to Branches -->
  <path d="M 400 140 L 400 180 L 170 180 L 170 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 180 L 630 180 L 630 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Sub-categories Leaf Nodes -->
  <!-- Formal Sub -->
  <rect x="70" y="340" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">सरकारी, कार्यालयीन, आवेदन</text>
  <text x="170" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">एवं व्यावसायिक पत्र</text>

  <!-- Informal Sub -->
  <rect x="300" y="340" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">पारिवारिक, व्यक्तिगत,</text>
  <text x="400" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">मित्र एवं संबंधियों के पत्र</text>

  <!-- Semi-Formal Sub -->
  <rect x="530" y="340" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">शासकीय अधिकारियों के मध्य</text>
  <text x="630" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">अर्द्ध-शासकीय (Demi-Official)</text>

  <!-- Connectors to sub-nodes -->
  <path d="M 170 290 L 170 340" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 290 L 400 340" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 630 290 L 630 340" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

</svg>