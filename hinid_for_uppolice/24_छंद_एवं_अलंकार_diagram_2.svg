<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <rect width="800" height="280" fill="#F8FAFC" rx="15"/>
  
  <rect x="280" y="20" width="240" height="50" rx="8" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="400" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">अलंकार के प्रमुख प्रकार</text>

  <!-- Left Branch -->
  <rect x="100" y="120" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="145" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">शब्दालंकार</text>
  <text x="120" y="175" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">• अनुप्रास (Anupras)</text>
  <text x="120" y="195" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">• यमक (Yamak)</text>
  <text x="120" y="215" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">• श्लेष (Shlesh)</text>

  <!-- Right Branch -->
  <rect x="450" y="120" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="145" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">अर्थालंकार</text>
  <text x="470" y="170" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">• उपमा, रूपक, उत्प्रेक्षा</text>
  <text x="470" y="190" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">• अतिशयोक्ति, मानवीकरण</text>
  <text x="470" y="210" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13">• भ्रांतिमान, संदेह आदि</text>

  <path d="M 400 70 L 400 95 L 225 95 L 225 120" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 70 L 400 95 L 575 95 L 575 120" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>