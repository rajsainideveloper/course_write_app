<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#F1F5F9" rx="12"/>

  <!-- Header -->
  <rect x="40" y="30" width="720" height="60" rx="8" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">वाच्य के प्रमुख भेद (Major Types of Voice)</text>

  <!-- Card 1: Kartrivachya -->
  <rect x="40" y="120" width="220" height="250" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="40" y="120" width="220" height="45" rx="10" fill="#0D9488"/>
  <text x="150" y="148" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. कर्तृवाच्य</text>
  <text x="150" y="190" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">कर्ता की प्रधानता</text>
  <text x="150" y="220" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अकर्मक और सकर्मक</text>
  <text x="150" y="240" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">दोनों क्रियाएँ होती हैं</text>
  <rect x="60" y="280" width="180" height="65" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="150" y="303" fill="#0F766E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">उदाहरण:</text>
  <text x="150" y="325" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" text-anchor="middle">राम ने पुस्तक पढ़ी।</text>

  <!-- Card 2: Karmavachya -->
  <rect x="290" y="120" width="220" height="250" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="290" y="120" width="220" height="45" rx="10" fill="#2563EB"/>
  <text x="400" y="148" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. कर्मवाच्य</text>
  <text x="400" y="190" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">कर्म की प्रधानता</text>
  <text x="400" y="220" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">केवल सकर्मक क्रिया</text>
  <text x="400" y="240" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">'द्वारा' / 'से' का प्रयोग</text>
  <rect x="310" y="280" width="180" height="65" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="400" y="303" fill="#1D4ED8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">उदाहरण:</text>
  <text x="400" y="325" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" text-anchor="middle">राम द्वारा पुस्तक पढ़ी गई।</text>

  <!-- Card 3: Bhavavachya -->
  <rect x="540" y="120" width="220" height="250" rx="10" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="540" y="120" width="220" height="45" rx="10" fill="#059669"/>
  <text x="650" y="148" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. भाववाच्य</text>
  <text x="650" y="190" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">भाव की प्रधानता</text>
  <text x="650" y="220" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">केवल अकर्मक क्रिया</text>
  <text x="650" y="240" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">असमर्थता / निषेध बोधक</text>
  <rect x="560" y="280" width="180" height="65" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="650" y="303" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">उदाहरण:</text>
  <text x="650" y="325" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" text-anchor="middle">राम से पढ़ा नहीं जाता।</text>
</svg>