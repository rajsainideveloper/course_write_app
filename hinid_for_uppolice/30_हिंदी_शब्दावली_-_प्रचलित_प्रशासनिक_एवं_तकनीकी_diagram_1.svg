<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="15"/>

  <!-- Box 1: विधायिका -->
  <g transform="translate(50, 120)">
    <rect width="180" height="90" rx="10" fill="url(#blueGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="90" y="40" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">विधायिका</text>
    <text x="90" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">(Legislature - अधिनियम)</text>
  </g>

  <path d="M 235 165 L 305 165" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Box 2: कार्यपालिका -->
  <g transform="translate(310, 120)">
    <rect width="180" height="90" rx="10" fill="url(#tealGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="90" y="40" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">कार्यपालिका</text>
    <text x="90" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">(Executive - परिपत्र/आदेश)</text>
  </g>

  <path d="M 495 165 L 565 165" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Box 3: न्यायपालिका -->
  <g transform="translate(570, 120)">
    <rect width="180" height="90" rx="10" fill="url(#emeraldGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="90" y="40" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">न्यायपालिका</text>
    <text x="90" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">(Judiciary - निर्णय/अधिनियम)</text>
  </g>

  <!-- Title over diagram -->
  <text x="400" y="50" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">सरकारी तंत्र का प्रशासनिक संरचनात्मक पदानुक्रम</text>
</svg>