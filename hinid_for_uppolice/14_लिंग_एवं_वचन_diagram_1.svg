<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="maleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="femaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#F8FAFC" rx="15"/>

  <!-- Root Node -->
  <rect x="300" y="40" width="200" height="60" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="75" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">हिंदी में लिंग भेद</text>

  <!-- Connectors from Root -->
  <path d="M 400 100 L 400 140 L 220 140 L 220 180" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 100 L 400 140 L 580 140 L 580 180" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Left Node: Puling -->
  <rect x="120" y="180" width="200" height="120" rx="10" fill="url(#maleGrad)" filter="url(#shadow)"/>
  <text x="220" y="210" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">पुल्लिंग</text>
  <text x="220" y="245" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" dy=".3em">पुरुष जाति का बोध</text>
  <text x="220" y="275" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">उदा: लड़का, राजा, घोड़ा</text>

  <!-- Right Node: Striling -->
  <rect x="480" y="180" width="200" height="120" rx="10" fill="url(#femaleGrad)" filter="url(#shadow)"/>
  <text x="580" y="210" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">स्त्रीलिंग</text>
  <text x="580" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle" dy=".3em">स्त्री जाति का बोध</text>
  <text x="580" y="275" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">उदा: लड़की, रानी, घोड़ी</text>
</svg>