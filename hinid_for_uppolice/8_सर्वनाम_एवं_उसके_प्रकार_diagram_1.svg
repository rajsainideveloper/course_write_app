<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#F8FAFC" rx="12"/>

  <!-- Central Node -->
  <rect x="300" y="30" width="200" height="60" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="65" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">सर्वनाम (6 भेद)</text>

  <!-- Connectors to Branches -->
  <path d="M 350 90 L 150 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 90 L 300 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 90 L 450 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 420 90 L 600 150" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 330 90 L 120 280" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 90 L 680 280" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Branch Nodes -->
  <!-- 1. Purushvachak -->
  <rect x="70" y="150" width="160" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
  <text x="150" y="180" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">पुरुषवाचक सर्वनाम</text>

  <!-- 2. Nischayvachak -->
  <rect x="240" y="150" width="140" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
  <text x="310" y="180" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">निश्चयवाचक सर्वनाम</text>

  <!-- 3. Anischayvachak -->
  <rect x="390" y="150" width="150" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
  <text x="465" y="180" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">अनिश्चयवाचक सर्वनाम</text>

  <!-- 4. Sambandhvachak -->
  <rect x="550" y="150" width="150" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
  <text x="625" y="180" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">संबंधवाचक सर्वनाम</text>

  <!-- 5. Prashnavachak -->
  <rect x="40" y="280" width="150" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
  <text x="115" y="310" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">प्रश्नवाचक सर्वनाम</text>

  <!-- 6. Nijvachak -->
  <rect x="610" y="280" width="150" height="50" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)"/>
  <text x="685" y="310" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">निजवाचक सर्वनाम</text>
</svg>