<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#F8FAFC" rx="15"/>

  <!-- Step 1 -->
  <rect x="50" y="50" width="200" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="150" y="80" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">चरण 1: पहचान</text>
  <text x="150" y="105" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" dy=".3em">अक्षरों को अंकों में बदलें</text>

  <!-- Connector 1 -->
  <path d="M 250 90 L 300 90" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="300" y="50" width="200" height="80" rx="10" fill="url(#stepGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="400" y="80" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">चरण 2: अंतर निकालें</text>
  <text x="400" y="105" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle, sans-serif" dy=".3em">+2, +3 या वर्ग/घन अंतर</text>

  <!-- Connector 2 -->
  <path d="M 500 90 L 550 90" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="550" y="50" width="200" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="650" y="80" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">चरण 3: पैटर्न लॉजिक</text>
  <text x="650" y="105" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" dy=".3em">लुप्त पद की गणना</text>

  <!-- Bottom Box / Summary -->
  <rect x="150" y="200" width="500" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))"/>
  <text x="400" y="230" fill="#1E3A8A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">UP पुलिस कांस्टेबल परीक्षा विशेष रणनीति</text>
  <text x="400" y="260" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle" dy=".3em">विकल्पों की सहायता लें और विपरीत वर्णों के जोड़ों (A-Z, B-Y) को मौखिक याद रखें।</text>
</svg>