<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#F8FAFC" rx="15"/>
  
  <rect x="50" y="100" width="180" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="140" y="145" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">आँकड़ों का संग्रह</text>

  <path d="M 230 140 L 310 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="310" y="100" width="180" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="400" y="135" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">पैटर्न पहचान</text>
  <text x="400" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">एवं वर्गीकरण</text>

  <path d="M 490 140 L 570 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="570" y="100" width="180" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="660" y="135" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">तार्किक निष्कर्ष</text>
  <text x="660" y="155" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">एवं निर्णय</text>
</svg>