<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Box 1 -->
  <rect x="50" y="100" width="180" height="80" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="140" y="145" fill="white" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">सांकेतिक डिकोडिंग</text>
  
  <!-- Arrow 1 -->
  <path d="M 230 140 L 300 140" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Box 2 -->
  <rect x="310" y="100" width="180" height="80" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="145" fill="white" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">गणितीय प्रतिस्थापन</text>
  
  <!-- Arrow 2 -->
  <path d="M 490 140 L 560 140" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Box 3 -->
  <rect x="570" y="100" width="180" height="80" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="660" y="145" fill="white" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">अंतिम समाधान</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8" />
    </marker>
  </defs>
</svg>