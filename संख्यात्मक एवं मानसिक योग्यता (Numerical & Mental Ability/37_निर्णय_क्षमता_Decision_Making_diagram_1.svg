<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="12"/>

  <!-- Step 1 -->
  <g transform="translate(50, 100)">
    <rect width="180" height="120" rx="10" fill="url(#blueGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="90" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">चरण 1</text>
    <text x="90" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">समस्या का आकलन</text>
    <text x="90" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">तथ्यों की पहचान</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 235 160 L 305 160" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(310, 100)">
    <rect width="180" height="120" rx="10" fill="url(#tealGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="90" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">चरण 2</text>
    <text x="90" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">विकल्पों का विश्लेषण</text>
    <text x="90" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">कानूनी और व्यावहारिक पक्ष</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 495 160 L 565 160" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(570, 100)">
    <rect width="180" height="120" rx="10" fill="url(#greenGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="90" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">चरण 3</text>
    <text x="90" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">सर्वोत्तम निर्णय</text>
    <text x="90" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">कार्यान्वयन व समीक्षा</text>
  </g>

  <text x="400" y="45" fill="#1E293B" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">निर्णय प्रक्रिया का तार्किक प्रवाह</text>
</svg>