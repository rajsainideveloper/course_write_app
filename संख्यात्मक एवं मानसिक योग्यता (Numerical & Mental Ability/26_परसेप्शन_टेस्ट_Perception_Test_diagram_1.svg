<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="50" y="40" width="120" height="120" rx="12" fill="url(#blueGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
  <circle cx="110" cy="100" r="30" fill="#FFFFFF" opacity="0.9"/>
  <text x="110" y="105" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">90°</text>
  <text x="110" y="180" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">चरण 1</text>

  <!-- Arrow 1 -->
  <path d="M 190 100 L 250 100" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="270" y="40" width="120" height="120" rx="12" fill="url(#tealGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
  <rect x="295" y="65" width="50" height="50" fill="#FFFFFF" opacity="0.9" rx="6"/>
  <text x="330" y="100" fill="#0D9488" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">180°</text>
  <text x="330" y="180" fill="#0D9488" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">चरण 2</text>

  <!-- Arrow 2 -->
  <path d="M 410 100 L 470 100" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 (Result) -->
  <rect x="490" y="40" width="120" height="120" rx="12" fill="url(#blueGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))"/>
  <polygon points="550,65 580,115 520,115" fill="#FFFFFF" opacity="0.9"/>
  <text x="550" y="100" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">270°</text>
  <text x="550" y="180" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">अगला चित्र</text>
</svg>