<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="250" fill="#F8FAFC" rx="12" ry="12"/>

  <!-- Box 1 -->
  <rect x="50" y="70" width="220" height="110" rx="10" ry="10" fill="url(#grad1)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="160" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">कथन / सूचना</text>
  <text x="160" y="145" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">शाब्दिक व प्रत्यक्ष तथ्य</text>

  <!-- Arrow 1 -->
  <path d="M 285 125 L 345 125" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <rect x="355" y="70" width="220" height="110" rx="10" ry="10" fill="url(#grad2)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="465" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">विश्लेषण प्रक्रिया</text>
  <text x="465" y="145" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">संदर्भ व तार्किक दृष्टि</text>

  <!-- Arrow 2 -->
  <path d="M 590 125 L 650 125" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <rect x="660" y="70" width="95" height="110" rx="10" ry="10" fill="#1E3A8A" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="707.5" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">निहित</text>
  <text x="707.5" y="150" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">अर्थ</text>
</svg>