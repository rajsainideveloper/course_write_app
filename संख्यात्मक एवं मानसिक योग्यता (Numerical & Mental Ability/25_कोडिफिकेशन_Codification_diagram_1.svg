<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#F8FAFC" rx="15"/>

  <!-- Main Title -->
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#1E3A8A" text-anchor="middle">कोडिफिकेशन के प्रमुख प्रकार</text>

  <!-- Central Node -->
  <rect x="300" y="80" width="200" height="60" rx="10" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <text x="400" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">कोडिंग-डिकोडिंग</text>

  <!-- Branch 1: Letter Coding -->
  <rect x="80" y="220" width="140" height="60" rx="8" fill="url(#boxGrad)" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">अक्षर कोड</text>

  <!-- Branch 2: Number Coding -->
  <rect x="250" y="220" width="140" height="60" rx="8" fill="url(#boxGrad)" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">संख्या कोड</text>

  <!-- Branch 3: Word Coding -->
  <rect x="420" y="220" width="140" height="60" rx="8" fill="url(#boxGrad)" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">शब्द कोड</text>

  <!-- Branch 4: Mixed Coding -->
  <rect x="590" y="220" width="140" height="60" rx="8" fill="url(#boxGrad)" stroke="#0D9488" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">मिश्रित कोड</text>

  <!-- Connectors from Central Node -->
  <path d="M 400 140 L 400 180 L 150 180 L 150 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 180 L 320 180 L 320 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 180 L 490 180 L 490 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 180 L 660 180 L 660 220" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Sub-details boxes -->
  <rect x="80" y="320" width="140" height="90" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="150" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">विशेषताएं</text>
  <text x="150" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">A → D, B → E</text>
  <text x="150" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">स्थान परिवर्तन</text>

  <rect x="250" y="320" width="140" height="90" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="320" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">विशेषताएं</text>
  <text x="320" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">CAT = 3-1-20</text>
  <text x="320" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">अंकों का योग</text>

  <rect x="420" y="320" width="140" height="90" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="490" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">विशेषताएं</text>
  <text x="490" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">वाक्यों का कोड</text>
  <text x="490" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">तुलना विधि</text>

  <rect x="590" y="320" width="140" height="90" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="660" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">विशेषताएं</text>
  <text x="660" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">अक्षर + संख्या</text>
  <text x="660" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">संयोजन नियम</text>

  <!-- Connectors to sub-details -->
  <path d="M 150 280 L 150 320" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 320 280 L 320 320" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 490 280 L 490 320" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 660 280 L 660 320" stroke="#94A3B8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>