<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="800" height="350" fill="#F8FAFC" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">संख्याओं का पदानुक्रम वर्गीकरण</text>

  <!-- Box 1: Real Numbers -->
  <rect x="50" y="80" width="700" height="230" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0D9488">वास्तविक संख्याएँ (Real Numbers)</text>

  <!-- Rational Box -->
  <rect x="80" y="140" width="300" height="145" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="230" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">परिमेय संख्याएँ (Rational)</text>
  <text x="230" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• पूर्णांक (Integers: Z)</text>
  <text x="230" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• पूर्ण संख्याएँ (Whole: W)</text>
  <text x="230" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">• प्राकृतिक संख्याएँ (Natural: N)</text>

  <!-- Irrational Box -->
  <rect x="420" y="140" width="300" height="145" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="570" y="170" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">अपरिमेय संख्याएँ (Irrational)</text>
  <text x="570" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">असांत, अनावर्ती दशमलव</text>
  <text x="570" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">उदाहरण: √2, √3, π</text>
</svg>