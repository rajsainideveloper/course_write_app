<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="50" y="100" width="200" height="100" rx="10" ry="10" fill="url(#boxGrad1)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="150" y="150" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">अनुपात (Ratio)</text>
  <text x="150" y="175" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">a : b = a / b</text>

  <path d="M 260 150 L 340 150" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="350" y="100" width="200" height="100" rx="10" ry="10" fill="url(#boxGrad2)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="450" y="150" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">समानुपात (Proportion)</text>
  <text x="450" y="175" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">a : b :: c : d</text>

  <path d="M 560 150 L 640 150" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="650" y="100" width="100" height="100" rx="10" ry="10" fill="#1E3A8A" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="700" y="150" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" dy=".3em">नियम</text>
  <text x="700" y="170" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" dy=".3em">bc = ad</text>
</svg>