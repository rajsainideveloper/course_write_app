<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="800" height="350" rx="15" fill="url(#bgGrad)" />
  
  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1E3A8A" text-anchor="middle">पाई चार्ट केंद्रीय कोण और प्रतिशत संबंध</text>
  
  <!-- Box 1 -->
  <g filter="url(#shadow)">
    <rect x="50" y="70" width="210" height="220" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="50" y="70" width="210" height="45" rx="10" fill="#0D9488"/>
    <text x="155" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">कुल मान</text>
    <text x="155" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155" text-anchor="middle">पूर्ण वृत्त = 360°</text>
    <text x="155" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#334155" text-anchor="middle">कुल प्रतिशत = 100%</text>
    <text x="155" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">360° = 100%</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 275 180 L 325 180" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <polygon points="325,180 315,175 315,185" fill="#64748B"/>

  <!-- Box 2 -->
  <g filter="url(#shadow)">
    <rect x="340" y="70" width="210" height="220" rx="10" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="340" y="70" width="210" height="45" rx="10" fill="#1E3A8A"/>
    <text x="445" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">केंद्रीय कोण सूत्र</text>
    <text x="445" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">कोण = (मान / कुल)</text>
    <text x="445" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">× 360°</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 565 180 L 615 180" stroke="#64748B" stroke-width="3" fill="none"/>
  <polygon points="615,180 605,175 605,185" fill="#64748B"/>

  <!-- Box 3 -->
  <g filter="url(#shadow)">
    <rect x="630" y="70" width="140" height="220" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="630" y="70" width="140" height="45" rx="10" fill="#059669"/>
    <text x="700" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">निष्कर्ष</text>
    <text x="700" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">1% = 3.6°</text>
    <text x="700" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155" text-anchor="middle">1° = 0.277%</text>
  </g>
</svg>