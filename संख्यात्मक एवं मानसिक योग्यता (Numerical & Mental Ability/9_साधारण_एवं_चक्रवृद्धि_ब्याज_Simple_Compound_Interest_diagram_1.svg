<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="12" fill="#F8FAFC" />

  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1E3A8A" text-anchor="middle">ब्याज संरचना का तुलनात्मक स्वरूप</text>

  <!-- Box 1: Principal -->
  <g transform="translate(50, 70)" filter="url(#shadow)">
    <rect width="180" height="80" rx="10" fill="url(#grad1)" />
    <text x="90" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">मूलधन (Principal)</text>
    <text x="90" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">आधार राशि (P)</text>
  </g>

  <!-- Arrow to SI -->
  <path d="M 230 110 L 320 80" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Arrow to CI -->
  <path d="M 230 110 L 320 210" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Box 2: SI -->
  <g transform="translate(330, 40)" filter="url(#shadow)">
    <rect width="200" height="80" rx="10" fill="url(#grad2)" />
    <text x="100" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">साधारण ब्याज (SI)</text>
    <text x="100" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">केवल मूलधन पर देय</text>
  </g>

  <!-- Box 3: CI -->
  <g transform="translate(330, 170)" filter="url(#shadow)">
    <rect width="200" height="80" rx="10" fill="url(#grad2)" />
    <text x="100" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">चक्रवृद्धि ब्याज (CI)</text>
    <text x="100" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">मूलधन + ब्याज पर देय</text>
  </g>

  <!-- Result SI -->
  <path d="M 530 80 L 600 80" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <g transform="translate(610, 50)" filter="url(#shadow)">
    <rect width="150" height="60" rx="8" fill="#1E3A8A" />
    <text x="75" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">समान वार्षिक ब्याज</text>
  </g>

  <!-- Result CI -->
  <path d="M 530 210 L 600 210" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <g transform="translate(610, 180)" filter="url(#shadow)">
    <rect width="150" height="60" rx="8" fill="#1E3A8A" />
    <text x="75" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उत्तरात्तर वृद्धि</text>
  </g>

</svg>