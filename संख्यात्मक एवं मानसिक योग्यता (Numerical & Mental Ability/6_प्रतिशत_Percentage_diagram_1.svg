<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#F8FAFC" rx="12"/>

  <!-- Step 1 -->
  <g transform="translate(50, 90)" filter="url(#shadow)">
    <rect width="180" height="100" rx="10" fill="url(#boxGrad)"/>
    <text x="90" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">प्रारंभिक मान</text>
    <text x="90" y="70" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">(Base Value)</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 240 140 L 310 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(310, 90)" filter="url(#shadow)">
    <rect width="180" height="100" rx="10" fill="url(#boxGrad)"/>
    <text x="90" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">प्रतिशत संक्रिया</text>
    <text x="90" y="70" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">(वृद्धि / कमी)</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 490 140 L 560 140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(560, 90)" filter="url(#shadow)">
    <rect width="180" height="100" rx="10" fill="url(#boxGrad)"/>
    <text x="90" y="40" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">अंतिम मान</text>
    <text x="90" y="70" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">(Final Value)</text>
  </g>
</svg>