<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="800" height="220" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Step 1 -->
  <g transform="translate(40, 60)">
    <rect width="120" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="60" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">प्रथम पद</text>
    <text x="60" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">आधार नियम</text>
  </g>

  <path d="M 175 100 L 225 100" stroke="#0D9488" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(240, 60)">
    <rect width="120" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="60" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">अंतर विश्लेषण</text>
    <text x="60" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">(Diff/Ratio)</text>
  </g>

  <path d="M 375 100 L 425 100" stroke="#0D9488" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(440, 60)">
    <rect width="120" height="80" rx="10" fill="url(#boxGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="60" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">नियम की पहचान</text>
    <text x="60" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">(Logic Check)</text>
  </g>

  <path d="M 575 100 L 625 100" stroke="#0D9488" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(640, 60)">
    <rect width="120" height="80" rx="10" fill="url(#059669)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
    <text x="60" y="45" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">अगला पद</text>
    <text x="60" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">(Final Answer)</text>
  </g>
</svg>