<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="250" rx="15" ry="15" fill="#F8FAFC"/>
  
  <!-- Box 1 -->
  <rect x="50" y="80" width="160" height="80" rx="10" ry="10" fill="url(#grad1)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="130" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">प्रथम युग्म (A : B)</text>
  
  <!-- Connector -->
  <path d="M 215 120 L 285 120" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="105" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">समान संबंध</text>
  
  <!-- Box 2 -->
  <rect x="290" y="80" width="200" height="80" rx="10" ry="10" fill="url(#grad2)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="390" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">तार्किक विश्लेषण</text>
  
  <!-- Connector 2 -->
  <path d="M 495 120 L 565 120" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="530" y="105" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">परिणाम</text>
  
  <!-- Box 3 -->
  <rect x="570" y="80" width="180" height="80" rx="10" ry="10" fill="url(#grad1)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
  <text x="660" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">द्वितीय युग्म (C : D)</text>
</svg>