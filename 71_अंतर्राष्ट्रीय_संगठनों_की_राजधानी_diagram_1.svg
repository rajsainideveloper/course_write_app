<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Central Hub -->
  <rect x="280" y="20" width="240" height="70" rx="12" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">जिनेवा (Geneva)</text>
  <text x="400" y="70" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">स्विट्जरलैंड</text>

  <!-- Connectors -->
  <path d="M 330 90 L 160 170" stroke="#94A3B8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 90 L 400 170" stroke="#94A3B8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 470 90 L 640 170" stroke="#94A3B8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- Node 1: WHO -->
  <rect x="50" y="170" width="220" height="110" rx="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="160" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">WHO</text>
  <text x="160" y="225" fill="#F0FDFA" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" dy=".3em">विश्व स्वास्थ्य संगठन</text>
  <text x="160" y="250" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" dy=".3em">स्थापना: 7 अप्रैल 1948</text>

  <!-- Node 2: WTO -->
  <rect x="290" y="170" width="220" height="110" rx="10" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  <text x="400" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">WTO</text>
  <text x="400" y="225" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" dy=".3em">विश्व व्यापार संगठन</text>
  <text x="400" y="250" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" dy=".3em">स्थापना: 1 जनवरी 1995</text>

  <!-- Node 3: Other Geneva Bodies -->
  <rect x="530" y="170" width="220" height="110" rx="10" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="640" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">अन्य प्रमुख निकाय</text>
  <text x="640" y="225" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">ILO (अंतर्राष्ट्रीय श्रम संगठन)</text>
  <text x="640" y="248" fill="#BAE6FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" dy=".3em">WIPO (विश्व बौद्धिक संपदा)</text>
</svg>