<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="cardGradGamma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="cardGradVisible" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="cardGradRadio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad3)" rx="15"/>
  <text x="400" y="45" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">विद्युत चुम्बकीय स्पेक्ट्रम की संरचना एवं ऊर्जा प्रवाह</text>

  <!-- High Energy Box -->
  <rect x="40" y="80" width="220" height="260" rx="10" fill="url(#cardGradGamma)" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="150" y="115" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. उच्च ऊर्जा तरंगें</text>
  <text x="60" y="155" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="13">• गामा किरणें (Gamma Rays)</text>
  <text x="60" y="185" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="13">• X-किरणें (X-Rays)</text>
  <text x="60" y="215" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="13">• आवर्ति: सर्वाधिक (Maximum)</text>
  <text x="60" y="245" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="13">• तरंगदैर्ध्य: न्यूनतम (Minimum)</text>
  <text x="60" y="275" fill="#FEE2E2" font-family="system-ui, -apple-system, sans-serif" font-size="13">• वेधन क्षमता: अत्यंत उच्च</text>

  <!-- Visible / Mid Box -->
  <rect x="290" y="80" width="220" height="260" rx="10" fill="url(#cardGradVisible)" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="400" y="115" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. मध्य क्षेत्र तरंगें</text>
  <text x="310" y="155" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="13">• पराबैंगनी (UV Rays)</text>
  <text x="310" y="185" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="13">• दृश्य प्रकाश (Visible)</text>
  <text x="310" y="215" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="13">• अवरक्त (Infrared)</text>
  <text x="310" y="245" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="13">• मानव दृष्टि हेतु संवेदी</text>
  <text x="310" y="275" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="13">• उष्मीय प्रभाव (Infrared)</text>

  <!-- Long Wave Box -->
  <rect x="540" y="80" width="220" height="260" rx="10" fill="url(#cardGradRadio)" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="650" y="115" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. दीर्घ तरंगें</text>
  <text x="560" y="155" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="13">• सूक्ष्म तरंगें (Microwave)</text>
  <text x="560" y="185" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="13">• रेडियो तरंगें (Radio Waves)</text>
  <text x="560" y="215" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="13">• तरंगदैर्ध्य: सर्वाधिक (Maximum)</text>
  <text x="560" y="245" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="13">• आवर्ति: न्यूनतम (Minimum)</text>
  <text x="560" y="275" fill="#DBEAFE" font-family="system-ui, -apple-system, sans-serif" font-size="13">• संचार व रडार में प्रयुक्त</text>
</svg>