<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Root -->
  <rect x="275" y="20" width="250" height="60" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="55" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">जीव कोशिका प्रकार</text>

  <!-- Lines -->
  <path d="M 400 80 L 400 120 L 200 120 L 200 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 80 L 400 120 L 600 120 L 600 160" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Prokaryote Box -->
  <rect x="100" y="160" width="200" height="60" rx="10" ry="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="200" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">प्रोकैरियोटिक कोशिका</text>

  <!-- Eukaryote Box -->
  <rect x="500" y="160" width="200" height="60" rx="10" ry="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="600" y="195" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">यूकैरियोटिक कोशिका</text>

  <!-- Prokaryote Features -->
  <path d="M 200 220 L 200 270" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="80" y="270" width="240" height="100" rx="10" ry="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="300" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">• अविकसित केंद्रक (Nucleoid)</text>
  <text x="200" y="325" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">• 70S राइबोसोम</text>
  <text x="200" y="350" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">• उदाहरण: जीवाणु, नील-हरित शैवाल</text>

  <!-- Eukaryote Features -->
  <path d="M 600 220 L 600 270" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480" y="270" width="240" height="100" rx="10" ry="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="300" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">• पूर्ण विकसित केंद्रक</text>
  <text x="600" y="325" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">• 80S राइबोसोम + झिल्लीयुक्त अंग</text>
  <text x="600" y="350" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">• उदाहरण: पादप, जंतु, कवक</text>
</svg>