<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Title Center -->
  <rect x="200" y="10" width="400" height="50" rx="8" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">मसौदा समिति (Drafting Committee) की संरचना</text>

  <!-- Chairman Box -->
  <rect x="280" y="90" width="240" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="118" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">अध्यक्ष</text>
  <text x="400" y="138" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">डॉ. बी.आर. अम्बेडकर</text>

  <!-- Connecting Lines -->
  <path d="M 400 150 L 400 190" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 120 190 L 680 190" stroke="#94A3B8" stroke-width="2" fill="none" />
  
  <path d="M 120 190 L 120 230" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 232 190 L 232 230" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 344 190 L 344 230" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 456 190 L 456 230" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 568 190 L 568 230" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 680 190 L 680 230" stroke="#94A3B8" stroke-width="2" fill="none" />

  <!-- Members Boxes -->
  <rect x="70" y="230" width="100" height="120" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="120" y="275" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">एन. गोपालस्वामी</text>
  <text x="120" y="295" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">अय्यंगार</text>

  <rect x="182" y="230" width="100" height="120" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="232" y="265" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">अल्लादी</text>
  <text x="232" y="285" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">कृष्णास्वामी</text>
  <text x="232" y="305" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">अय्यर</text>

  <rect x="294" y="230" width="100" height="120" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="344" y="275" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">डॉ. के.एम.</text>
  <text x="344" y="295" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">मुंशी</text>

  <rect x="406" y="230" width="100" height="120" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="456" y="265" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">सैय्यद</text>
  <text x="456" y="285" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">मोहम्मद</text>
  <text x="456" y="305" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">सादुल्लाह</text>

  <rect x="518" y="230" width="100" height="120" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="568" y="265" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">एन. माधव राव</text>
  <text x="568" y="290" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(बी.एल. मित्र के</text>
  <text x="568" y="305" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">स्थान पर)</text>

  <rect x="630" y="230" width="100" height="120" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="680" y="265" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">टी.टी.</text>
  <text x="680" y="285" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">कृष्णामचारी</text>
  <text x="680" y="305" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(डी.पी. खेतान की</text>
  <text x="680" y="320" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">मृत्यु के बाद)</text>

  <rect x="70" y="370" width="660" height="35" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="400" y="392" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">याद रखने की युक्ति: अम्बेडकर के साथ 'कृष्णा', 'गोपाल', 'मुंशी', 'सादुल्लाह', 'माधव' और 'टी.टी.' थे।</text>
</svg>