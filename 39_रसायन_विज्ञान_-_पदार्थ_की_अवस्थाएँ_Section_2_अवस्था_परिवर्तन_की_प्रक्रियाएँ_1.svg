<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="solidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="gasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">पदार्थ की प्रावस्था परिवर्तन चक्र (Phase Transitions)</text>

  <!-- Solid Box -->
  <rect x="50" y="160" width="160" height="80" rx="10" ry="10" fill="url(#solidGrad)" filter="url(#shadow)"/>
  <text x="130" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">ठोस (Solid)</text>

  <!-- Liquid Box -->
  <rect x="320" y="160" width="160" height="80" rx="10" ry="10" fill="url(#liquidGrad)" filter="url(#shadow)"/>
  <text x="400" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">द्रव (Liquid)</text>

  <!-- Gas Box -->
  <rect x="590" y="160" width="160" height="80" rx="10" ry="10" fill="url(#gasGrad)" filter="url(#shadow)"/>
  <text x="670" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">गैस (Gas)</text>

  <!-- Solid to Liquid (Melting) -->
  <path d="M 210 180 L 320 180" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle">गलन (Melting)</text>

  <!-- Liquid to Solid (Freezing) -->
  <path d="M 320 220 L 210 220" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="265" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="middle">जमाव (Freezing)</text>

  <!-- Liquid to Gas (Vaporization) -->
  <path d="M 480 180 L 590 180" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="535" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0D9488" text-anchor="middle">वाष्पीकरण</text>

  <!-- Gas to Liquid (Condensation) -->
  <path d="M 590 220 L 480 220" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="535" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0D9488" text-anchor="middle">संघनन (Condensation)</text>

  <!-- Solid to Gas (Sublimation) -->
  <path d="M 130 160 C 130 70, 670 70, 670 160" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#DC2626" text-anchor="middle">उर्ध्वपातन (Sublimation)</text>

  <!-- Gas to Solid (Deposition) -->
  <path d="M 670 240 C 670 330, 130 330, 130 240" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#7C3AED" text-anchor="middle">निक्षेपण / निक्षेप (Deposition)</text>
</svg>