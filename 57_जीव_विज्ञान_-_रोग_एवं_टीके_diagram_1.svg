<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Background -->
  <rect x="150" y="20" width="500" height="50" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">जीवनशैली रोगों का चक्र एवं अंतर्संबंध</text>

  <!-- Center Box: Obesity -->
  <rect x="300" y="120" width="200" height="70" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="400" y="150" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">मोटापा (Obesity)</text>
  <text x="400" y="172" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">BMI &gt; 30 kg/m²</text>

  <!-- Left Box: Diabetes -->
  <rect x="80" y="270" width="200" height="80" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="180" y="300" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">मधुमेह (Diabetes)</text>
  <text x="180" y="322" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">इंसुलिन प्रतिरोध (Type 2)</text>

  <!-- Right Box: Hypertension -->
  <rect x="520" y="270" width="200" height="80" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="620" y="300" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">उच्च रक्तचाप &amp; हृदय रोग</text>
  <text x="620" y="322" fill="#D1FAE5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">एथेरोस्क्लेरोसिस (Atherosclerosis)</text>

  <!-- Arrows -->
  <path d="M 350 190 L 230 265" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 450 190 L 570 265" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 280 310 L 510 310" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>