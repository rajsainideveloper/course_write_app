<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="#F8FAFC" rx="15" />

  <!-- Title Inside SVG -->
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">
    मौर्य साम्राज्य का प्रशासनिक पदानुक्रम (Administrative Hierarchy)
  </text>

  <!-- Level 1: Central -->
  <rect x="275" y="70" width="250" height="55" rx="10" fill="url(#blueGrad)" filter="url(#dropShadow)" />
  <text x="400" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">केन्द्र (साम्राज्य)</text>
  <text x="400" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">प्रमुख: राजा (शीर्ष सत्ता)</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 400 125 L 400 165" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 2: Province -->
  <rect x="275" y="175" width="250" height="55" rx="10" fill="url(#tealGrad)" filter="url(#dropShadow)" />
  <text x="400" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">प्रांत (चक्र)</text>
  <text x="400" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">प्रमुख: कुमार / आर्यपुत्र (राजवंश से)</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 400 230 L 400 270" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 3: District -->
  <rect x="275" y="280" width="250" height="55" rx="10" fill="url(#emeraldGrad)" filter="url(#dropShadow)" />
  <text x="400" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">मण्डल / आहार (विषय)</text>
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">प्रमुख: प्रादेशिक / स्थानिक / राजुक</text>

  <!-- Arrow 3 to 4 split left -->
  <path d="M 350 335 L 220 380" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  
  <!-- Arrow 3 to 4 split right -->
  <path d="M 450 335 L 580 380" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 4 Left: Urban -->
  <rect x="70" y="390" width="260" height="65" rx="10" fill="url(#amberGrad)" filter="url(#dropShadow)" />
  <text x="200" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">नगरीय प्रशासन (नगर)</text>
  <text x="200" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FEF3C7" text-anchor="middle">प्रमुख: नागरक (30 सदस्यों की 6 समितियाँ)</text>

  <!-- Level 4 Right: Rural -->
  <rect x="470" y="390" width="260" height="65" rx="10" fill="url(#amberGrad)" filter="url(#dropShadow)" />
  <text x="600" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">स्थानीय प्रशासन (ग्राम)</text>
  <text x="600" y="433" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FEF3C7" text-anchor="middle">प्रमुख: ग्रामिक (न्यूनतम इकाई: 10 ग्राम = गोप)</text>
</svg>