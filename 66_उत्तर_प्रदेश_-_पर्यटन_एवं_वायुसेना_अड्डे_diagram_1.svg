<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1E3A8A" text-anchor="middle">उत्तर प्रदेश पर्यटन परिपथ का वर्गीकरण</text>

  <!-- Central Box -->
  <rect x="275" y="70" width="250" height="60" rx="10" ry="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="400" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dy=".3em">उत्तर प्रदेश पर्यटन परिपथ</text>

  <!-- Connecting Lines -->
  <path d="M 400 130 L 150 200" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 130 L 400 200" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400 130 L 650 200" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Left Box -->
  <rect x="50" y="200" width="200" height="100" rx="10" ry="10" fill="url(#grad2)" filter="url(#shadow)" />
  <text x="150" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">बौद्ध परिपथ (Buddhist)</text>
  <text x="150" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">सारनाथ, कुशीनगर, श्रावस्ती,</text>
  <text x="150" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">कौशांबी, संकिसा, देवदह</text>

  <!-- Middle Box -->
  <rect x="300" y="200" width="200" height="100" rx="10" ry="10" fill="url(#grad3)" filter="url(#shadow)" />
  <text x="400" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">रामायण/ब्रज परिपथ</text>
  <text x="400" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ECFDF5" text-anchor="middle">अयोध्या, चित्रकूट, मथुरा,</text>
  <text x="400" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ECFDF5" text-anchor="middle">वृंदावन, गोवर्धन, नंदगांव</text>

  <!-- Right Box -->
  <rect x="550" y="200" width="200" height="100" rx="10" ry="10" fill="url(#grad2)" filter="url(#shadow)" />
  <text x="650" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">विरासत/अवध परिपथ</text>
  <text x="650" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">आगरा, फतेहपुर सीकरी,</text>
  <text x="650" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">लखनऊ, वाराणसी, प्रयागराज</text>
</svg>