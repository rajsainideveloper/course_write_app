<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="gradSub1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="gradSub2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Root Box -->
  <rect x="250" y="20" width="300" height="60" rx="10" fill="url(#gradMain)" filter="url(#shadow)" />
  <text x="400" y="50" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">एशियाई क्षेत्र वर्गीकरण</text>

  <!-- Connectors -->
  <path d="M 400 80 L 400 120 L 200 120 L 200 160" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 400 80 L 400 120 L 600 120 L 600 160" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 2 Boxes -->
  <rect x="80" y="160" width="240" height="50" rx="8" fill="url(#gradSub1)" filter="url(#shadow)" />
  <text x="200" y="185" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">पूर्वी एशिया (East Asia)</text>

  <rect x="480" y="160" width="240" height="50" rx="8" fill="url(#gradSub2)" filter="url(#shadow)" />
  <text x="600" y="185" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">दक्षिण-पूर्व एशिया (ASEAN)</text>

  <!-- Leaf Connectors -->
  <path d="M 200 210 L 200 260" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 600 210 L 600 260" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Level 3 Nodes -->
  <rect x="20" y="260" width="360" height="110" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
  <text x="200" y="290" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">जापान (टोक्यो - येन)</text>
  <text x="200" y="320" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">दक्षिण कोरिया (सियोल - वॉन)</text>
  <text x="200" y="350" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">उत्तर कोरिया (प्योंगयांग - वॉन)</text>

  <rect x="420" y="260" width="360" height="110" rx="8" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2" filter="url(#shadow)" />
  <text x="600" y="282" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">इंडोनेशिया | मलेशिया | सिंगापुर</text>
  <text x="600" y="312" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">थाईलैंड | वियतनाम | फिलीपींस</text>
  <text x="600" y="342" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" text-anchor="middle">(मुख्य मुद्राएँ: रुपिया, रिंगित, बात, डोंग, पेसो)</text>
</svg>