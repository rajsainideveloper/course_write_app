<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="nilgiriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115E59" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="dropSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Outline Concept for South India Node Joint -->
  <path d="M 250 120 L 370 280 L 550 120" stroke="#94A3B8" stroke-width="3" fill="none" stroke-dasharray="4 4"/>

  <!-- Left Card: Western Ghats -->
  <g transform="translate(40, 60)" filter="url(#dropSh)">
    <rect width="250" height="160" rx="10" fill="#1E3A8A" />
    <text x="125" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">पश्चिमी घाट (सह्याद्रि)</text>
    <line x1="20" y1="50" x2="230" y2="50" stroke="#3B82F6" stroke-width="1" />
    <text x="20" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• सतत श्रृंखला (Continuous Range)</text>
    <text x="20" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• सर्वोच्च चोटी: अनामुडी (2695 मी)</text>
    <text x="20" y="140" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• अत्यधिक जैव विविधता संपन्न क्षेत्र</text>
  </g>

  <!-- Right Card: Eastern Ghats -->
  <g transform="translate(510, 60)" filter="url(#dropSh)">
    <rect width="250" height="160" rx="10" fill="#0D9488" />
    <text x="125" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">पूर्वी घाट</text>
    <line x1="20" y1="50" x2="230" y2="50" stroke="#14B8A6" stroke-width="1" />
    <text x="20" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• नदियों द्वारा खंडित (Discontinuous)</text>
    <text x="20" y="110" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• मुख्य पहाड़ियाँ: जावड़ी, शेवरॉय</text>
    <text x="20" y="140" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• औसत ऊँचाई पश्चिमी घाट से कम</text>
  </g>

  <!-- Central Intersecting Junction: Nilgiri -->
  <g transform="translate(265, 270)" filter="url(#dropSh)">
    <rect width="270" height="120" rx="12" fill="url(#nilgiriGrad)" />
    <text x="135" y="35" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">मिलन बिंदु: नीलगिरि पहाड़ियाँ</text>
    <text x="135" y="55" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="11" font-style="italic" text-anchor="middle">(Junction of Western &amp; Eastern Ghats)</text>
    <line x1="20" y1="70" x2="250" y2="70" stroke="#059669" stroke-width="1" />
    <text x="135" y="95" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">चोटी: दोदाबेटा (2637 मी)</text>
  </g>

  <!-- Arrow Markers linking to Center -->
  <path d="M 290 170 L 340 270" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 510 170 L 460 270" stroke="#94A3B8" stroke-width="2" fill="none" />
</svg>