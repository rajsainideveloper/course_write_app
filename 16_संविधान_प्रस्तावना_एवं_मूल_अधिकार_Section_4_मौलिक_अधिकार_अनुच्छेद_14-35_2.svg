<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Root Center Box -->
  <rect x="250" y="10" width="300" height="50" rx="8" fill="url(#mainGrad)" filter="url(#shadow)" />
  <text x="400" y="41" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">6 मूल अधिकारों का वर्गीकरण (भाग-III)</text>

  <!-- Left Side Arrows & Boxes -->
  <path d="M 250 35 L 180 35 L 180 90" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 250 35 L 180 35 L 180 215" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 250 35 L 180 35 L 180 340" stroke="#94A3B8" stroke-width="2" fill="none" />

  <!-- Right Side Arrows & Boxes -->
  <path d="M 550 35 L 620 35 L 620 90" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 550 35 L 620 35 L 620 215" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 550 35 L 620 35 L 620 340" stroke="#94A3B8" stroke-width="2" fill="none" />

  <!-- Boxes left -->
  <rect x="20" y="90" width="280" height="65" rx="6" fill="url(#boxGrad)" filter="url(#shadow)" />
  <text x="160" y="115" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. समानता का अधिकार</text>
  <text x="160" y="138" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अनुच्छेद 14 - 18</text>

  <rect x="20" y="215" width="280" height="65" rx="6" fill="url(#boxGrad)" filter="url(#shadow)" />
  <text x="160" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. स्वतंत्रता का अधिकार</text>
  <text x="160" y="263" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अनुच्छेद 19 - 22</text>

  <rect x="20" y="340" width="280" height="65" rx="6" fill="url(#boxGrad)" filter="url(#shadow)" />
  <text x="160" y="365" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. शोषण के विरुद्ध अधिकार</text>
  <text x="160" y="388" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अनुच्छेद 23 - 24</text>

  <!-- Boxes right -->
  <rect x="500" y="90" width="280" height="65" rx="6" fill="url(#boxGrad)" filter="url(#shadow)" />
  <text x="640" y="115" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. धार्मिक स्वतंत्रता का अधिकार</text>
  <text x="640" y="138" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अनुच्छेद 25 - 28</text>

  <rect x="500" y="215" width="280" height="65" rx="6" fill="url(#boxGrad)" filter="url(#shadow)" />
  <text x="640" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">5. संस्कृति एवं शिक्षा संबंधी अधिकार</text>
  <text x="640" y="263" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अनुच्छेद 29 - 30</text>

  <rect x="500" y="340" width="280" height="65" rx="6" fill="url(#boxGrad)" filter="url(#shadow)" />
  <text x="640" y="365" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">6. संवैधानिक उपचारों का अधिकार</text>
  <text x="640" y="388" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">अनुच्छेद 32 (संविधान का हृदय व आत्मा)</text>

  <!-- Base Note -->
  <rect x="20" y="430" width="760" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" />
  <text x="400" y="449" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">नोट: राष्ट्रीय आपातकाल (अनुच्छेद 352) के दौरान भी अनुच्छेद 20 और 21 को निलंबित नहीं किया जा सकता है।</text>
</svg>