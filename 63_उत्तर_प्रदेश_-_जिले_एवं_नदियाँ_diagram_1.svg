<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gradState" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="gradDivision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="gradDistrict" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Background -->
  <rect x="20" y="20" width="760" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle" dy=".3em">उत्तर प्रदेश प्रशासनिक पदानुक्रम (Administrative Hierarchy)</text>

  <!-- Level 1: State -->
  <g filter="url(#shadow)">
    <rect x="250" y="100" width="300" height="60" rx="10" fill="url(#gradState)"/>
    <text x="400" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उत्तर प्रदेश शासन (State)</text>
    <text x="400" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">राजधानी: लखनऊ</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 400 160 L 400 200" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 2: Divisions -->
  <g filter="url(#shadow)">
    <rect x="250" y="205" width="300" height="60" rx="10" fill="url(#gradDivision)"/>
    <text x="400" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">18 प्रशासनिक मंडल (Divisions)</text>
    <text x="400" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#CCFBF1" text-anchor="middle">प्रमुख: मंडलायुक्त (Divisional Commissioner)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 400 265 L 400 305" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Level 3: Districts -->
  <g filter="url(#shadow)">
    <rect x="250" y="310" width="300" height="60" rx="10" fill="url(#gradDistrict)"/>
    <text x="400" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">75 प्रशासनिक जिले (Districts)</text>
    <text x="400" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">प्रमुख: जिलाधिकारी (DM) / पुलिस अधीक्षक (SP)</text>
  </g>
</svg>