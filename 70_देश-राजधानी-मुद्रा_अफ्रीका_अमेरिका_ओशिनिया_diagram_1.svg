<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="gradNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="gradOceania" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title Background -->
  <rect x="10" y="10" width="780" height="40" rx="6" fill="#64748B" />
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">महाद्वीपीय वर्गीकरण एवं मुद्रा संरचना</text>

  <!-- North America Box -->
  <rect x="30" y="70" width="220" height="210" rx="10" fill="url(#gradNorth)" filter="url(#shadow)" />
  <text x="140" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">उत्तरी अमेरिका</text>
  <line x1="50" y1="115" x2="230" y2="115" stroke="#93C5FD" stroke-width="1" />
  <text x="140" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0F2FE" text-anchor="middle">USA: वाशिंगटन D.C.</text>
  <text x="140" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">(अमेरिकी डॉलर)</text>
  <text x="140" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0F2FE" text-anchor="middle">कनाडा: ओटावा</text>
  <text x="140" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">(कैनेडियन डॉलर)</text>

  <!-- South America Box -->
  <rect x="290" y="70" width="220" height="210" rx="10" fill="url(#gradSouth)" filter="url(#shadow)" />
  <text x="400" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">दक्षिणी अमेरिका</text>
  <line x1="310" y1="115" x2="490" y2="115" stroke="#A7F3D0" stroke-width="1" />
  <text x="400" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ECFDF5" text-anchor="middle">ब्राजील: ब्रासीलिया</text>
  <text x="400" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#A7F3D0" text-anchor="middle">(ब्राजीलियाई रियल)</text>
  <text x="400" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">अमेजन बेसिन एवं साओ पाओलो</text>
  <text x="400" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#A7F3D0" text-anchor="middle">(प्रमुख आर्थिक केंद्र)</text>

  <!-- Oceania Box -->
  <rect x="550" y="70" width="220" height="210" rx="10" fill="url(#gradOceania)" filter="url(#shadow)" />
  <text x="660" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ओशिनिया</text>
  <line x1="570" y1="115" x2="750" y2="115" stroke="#99F6E4" stroke-width="1" />
  <text x="660" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#CCFBF1" text-anchor="middle">ऑस्ट्रेलिया: कैनबरा</text>
  <text x="660" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4" text-anchor="middle">(ऑस्ट्रेलियन डॉलर)</text>
  <text x="660" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#CCFBF1" text-anchor="middle">न्यूजीलैंड: वेलिंगटन</text>
  <text x="660" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4" text-anchor="middle">(न्यूजीलैंड डॉलर)</text>
</svg>