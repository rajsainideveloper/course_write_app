<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%">
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="12" fill="url(#orbitBg)"/>

  <!-- Title -->
  <text x="400" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle" dy=".3em">केप्लर का द्वितीय नियम (क्षेत्रफलीय चाल नियत)</text>

  <!-- Elliptical Orbit -->
  <ellipse cx="400" cy="200" rx="280" ry="120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Swept Area 1 (Far from Sun - Slower) -->
  <path d="M 200 200 L 630 115 A 280 120 0 0 1 660 150 Z" fill="#059669" opacity="0.35"/>
  <text x="540" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">क्षेत्रफल A₁ (धीमी गति)</text>

  <!-- Swept Area 2 (Close to Sun - Faster) -->
  <path d="M 200 200 L 130 160 A 280 120 0 0 1 125 220 Z" fill="#059669" opacity="0.35"/>
  <text x="240" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a7f3d0" text-anchor="middle">क्षेत्रफल A₂ (तीव्र गति)</text>

  <!-- Sun at Focus -->
  <circle cx="200" cy="200" r="22" fill="url(#sunGrad)" filter="url(#glow)"/>
  <text x="200" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#7c2d12" text-anchor="middle" dy=".3em">सूर्य</text>

  <!-- Planet Position 1 -->
  <circle cx="630" cy="115" r="12" fill="url(#planetGrad)"/>
  
  <!-- Planet Position 2 -->
  <circle cx="130" cy="160" r="12" fill="url(#planetGrad)"/>

  <!-- Explanatory note -->
  <rect x="220" y="310" width="360" height="40" rx="8" fill="#1e3a8a" opacity="0.8"/>
  <text x="400" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e0f2fe" text-anchor="middle" dy=".3em">समान समय t में: क्षेत्रफल A₁ = क्षेत्रफल A₂</text>
</svg>