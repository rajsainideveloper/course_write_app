<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="15" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="400" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">यूरोपीय मुद्रा क्षेत्र (Eurozone vs Non-Eurozone)</text>

  <!-- Node 1: Central Core -->
  <rect x="270" y="80" width="260" height="60" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" />
  <text x="400" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">यूरोपीय देश (European Nations)</text>
  <text x="400" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">आर्थिक एवं मौद्रिक विभाजन</text>

  <!-- Connectors -->
  <path d="M 330 140 L 200 210" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 140 L 600 210" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Left Branch: Eurozone -->
  <rect x="70" y="220" width="260" height="140" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" />
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">यूरोज़ोन (Eurozone)</text>
  <text x="200" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">आधिकारिक मुद्रा: यूरो (€)</text>
  <line x1="90" y1="275" x2="310" y2="275" stroke="#60A5FA" stroke-width="1" />
  <text x="200" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F1F5F9" text-anchor="middle">• फ्रांस (पेरिस)  • जर्मनी (बर्लिन)</text>
  <text x="200" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F1F5F9" text-anchor="middle">• इटली (रोम)    • स्पेन (मैड्रिड)</text>
  <text x="200" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F1F5F9" text-anchor="middle">• नीदरलैंड (एम्स्टर्डम) • ग्रीस (एथेंस)</text>

  <!-- Right Branch: Non-Eurozone -->
  <rect x="470" y="220" width="260" height="140" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" />
  <text x="600" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">गैर-यूरोज़ोन (Non-Eurozone)</text>
  <text x="600" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93C5FD" text-anchor="middle">स्वतंत्र / सम्प्रभु मुद्राएँ</text>
  <line x1="490" y1="275" x2="710" y2="275" stroke="#60A5FA" stroke-width="1" />
  <text x="600" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F1F5F9" text-anchor="middle">• यूके: पाउंड स्टर्लिंग (£)</text>
  <text x="600" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F1F5F9" text-anchor="middle">• रूस: रूसी रूबल (₽)</text>
  <text x="600" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F1F5F9" text-anchor="middle">• स्विट्जरलैंड: स्विस फ्रैंक (CHF)</text>
</svg>