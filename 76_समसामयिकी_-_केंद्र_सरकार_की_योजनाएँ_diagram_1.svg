<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">PMAY-G वित्तीय सहायता एवं अभिसरण (Convergence) ढाँचा</text>

  <!-- Central Box -->
  <rect x="250" y="60" width="300" height="60" rx="10" ry="10" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="400" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">मूल इकाई सहायता (Base Grant)</text>
  <text x="400" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">मैदानी: ₹1.20 लाख | पहाड़ी: ₹1.30 लाख (60:40)</text>

  <!-- Connectors -->
  <path d="M 330 120 L 200 180" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 470 120 L 600 180" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Node Left -->
  <rect x="50" y="180" width="300" height="70" rx="10" ry="10" fill="url(#tealGrad)" filter="url(#shadow)" />
  <text x="200" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">मनरेगा (MGNREGA) अभिसरण</text>
  <text x="200" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#CCFBF1" text-anchor="middle">90-95 दिनों की अकुशल मजदूरी (अतिरिक्त वित्तीय लाभ)</text>

  <!-- Node Right -->
  <rect x="450" y="180" width="300" height="70" rx="10" ry="10" fill="url(#greenGrad)" filter="url(#shadow)" />
  <text x="600" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SBM-G (स्वच्छ भारत मिशन) अभिसरण</text>
  <text x="600" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#D1FAE5" text-anchor="middle">शौचालय निर्माण हेतु ₹12,000 की पृथक सहायता</text>

  <!-- Bottom Summary Box -->
  <rect x="150" y="280" width="500" height="45" rx="8" ry="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="350" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">कुल प्रभावी लाभ: </text>
  <text x="490" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">₹ 1.50 लाख से अधिक (समानुकूलित)</text>
</svg>