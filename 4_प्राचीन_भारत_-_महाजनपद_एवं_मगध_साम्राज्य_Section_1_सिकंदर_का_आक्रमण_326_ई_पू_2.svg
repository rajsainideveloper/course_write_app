<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <linearGradient id="warGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <rect width="800" height="220" fill="#FFF5F5" rx="12" stroke="#FCA5A5" stroke-width="2"/>
  
  <text x="400" y="35" fill="#991B1B" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">हाइडेस्पस (झेलम) का युद्ध - 326 ई.पू.</text>

  <!-- Flow Matrix -->
  <rect x="50" y="80" width="200" height="70" rx="8" fill="url(#warGrad)" filter="url(#boxShadow)"/>
  <text x="150" y="110" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">सिकंदर की सेना</text>
  <text x="150" y="135" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">यूनानी आक्रामक बल</text>

  <text x="400" y="115" fill="#DC2626" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">VS</text>

  <rect x="550" y="80" width="200" height="70" rx="8" fill="#1E3A8A" filter="url(#boxShadow)"/>
  <text x="650" y="110" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">राजा पोरस (पुरु)</text>
  <text x="650" y="135" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">पौरव राष्ट्र (झेलम-चिनाब मध्य)</text>

  <text x="400" y="195" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">परिणाम: पोरस की वीरता से प्रभावित होकर सिकंदर ने उसका राज्य वापस लौटा दिया।</text>
</svg>