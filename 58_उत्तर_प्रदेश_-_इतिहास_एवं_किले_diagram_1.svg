<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Top Level: Central Admin -->
  <rect x="250" y="30" width="300" height="60" rx="10" ry="10" fill="url(#gradTop)" filter="url(#shadow)"/>
  <text x="400" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">सम्राट / केंद्रीय प्रशासन (कन्नौज/पाटलिपुत्र)</text>

  <!-- Mid Level: Provincial Admin -->
  <rect x="100" y="170" width="260" height="60" rx="10" ry="10" fill="url(#gradMid)" filter="url(#shadow)"/>
  <text x="230" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">भुक्ति (प्रांत) - उपरिक / गोप्ता</text>

  <rect x="440" y="170" width="260" height="60" rx="10" ry="10" fill="url(#gradMid)" filter="url(#shadow)"/>
  <text x="570" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">विषय (जिला) - विषयपति</text>

  <!-- Bottom Level: Local Admin -->
  <rect x="100" y="310" width="260" height="60" rx="10" ry="10" fill="url(#gradLow)" filter="url(#shadow)"/>
  <text x="230" y="340" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">वीथि / नगर (शहर) - नगरपति</text>

  <rect x="440" y="310" width="260" height="60" rx="10" ry="10" fill="url(#gradLow)" filter="url(#shadow)"/>
  <text x="570" y="340" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">ग्राम (गाँव) - ग्रामिक / महत्तर</text>

  <!-- Connectors -->
  <path d="M 330 90 L 230 170" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 470 90 L 570 170" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 230 230 L 230 310" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 570 230 L 570 310" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
</svg>