<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="200" y="10" width="400" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#boxShadow)"/>
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">मैसूर के पतन का कालक्रम (1767-1799)</text>

  <!-- Timeline Nodes -->
  <g filter="url(#boxShadow)">
    <rect x="40" y="90" width="150" height="80" rx="8" fill="url(#g1)"/>
    <text x="115" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">प्रथम युद्ध</text>
    <text x="115" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">1769 | मद्रास संधि</text>
  </g>

  <g filter="url(#boxShadow)">
    <rect x="230" y="90" width="150" height="80" rx="8" fill="url(#g1)"/>
    <text x="305" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">द्वितीय युद्ध</text>
    <text x="305" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">1784 | मंगलौर संधि</text>
  </g>

  <g filter="url(#boxShadow)">
    <rect x="420" y="90" width="150" height="80" rx="8" fill="url(#g1)"/>
    <text x="495" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">तृतीय युद्ध</text>
    <text x="495" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">1792 | श्रीरंगपट्टनम</text>
  </g>

  <g filter="url(#boxShadow)">
    <rect x="610" y="90" width="150" height="80" rx="8" fill="url(#g2)"/>
    <text x="685" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">चतुर्थ युद्ध</text>
    <text x="685" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FEF3C7" text-anchor="middle">1799 | टीपू का अवसान</text>
  </g>

  <!-- Connectors -->
  <line x1="190" y1="130" x2="230" y2="130" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4"/>
  <line x1="380" y1="130" x2="420" y2="130" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4"/>
  <line x1="570" y1="130" x2="610" y2="130" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4"/>

  <!-- Explanatory Box -->
  <rect x="40" y="210" width="720" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="60" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">मुख्य निष्कर्ष:</text>
  <text x="60" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">प्रथम दो युद्धों में मैसूर का पलड़ा भारी रहा, परंतु अंतिम दो युद्धों में कूटनीतिक अलगाव और सैन्य कमजोरी के कारण मैसूर हार गया।</text>
</svg>