<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%">
  <defs>
    <linearGradient id="khiljiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="khiljiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="800" height="420" fill="#F8FAFC" rx="15" />
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A" text-anchor="middle">अलाउद्दीन खिलजी की त्रि-स्तरीय बाजार नियंत्रण संरचना</text>

  <!-- Central Authority -->
  <rect x="250" y="65" width="300" height="60" rx="10" fill="url(#khiljiRed)" filter="url(#shadow)" />
  <text x="400" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">दीवान-ए-रियासत (वाणिज्य मंत्रालय)</text>
  <text x="400" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FEE2E2" text-anchor="middle">प्रमुख अधिकारी: शहाना-ए-मंडी (बाजार अधीक्षक)</text>

  <!-- Connectors -->
  <path d="M 400 125 L 400 160 M 400 160 L 150 160 L 150 190 M 400 160 L 400 190 M 400 160 L 650 160 L 650 190" stroke="#94A3B8" stroke-width="2" fill="none" />

  <!-- Market 1 -->
  <rect x="40" y="195" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="195" width="220" height="35" rx="10" fill="url(#khiljiGold)" />
  <text x="150" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. गल्ला-ए-मंडी (अनाज बाजार)</text>
  <text x="50" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• गेहूँ, चावल, जौ का निश्चित दाम</text>
  <text x="50" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• केवल पंजीकृत व्यापारियों को अनुमति</text>
  <text x="50" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• शासकीय गोदामों में आपात अनाज संचय</text>

  <!-- Market 2 -->
  <rect x="290" y="195" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
  <rect x="290" y="195" width="220" height="35" rx="10" fill="url(#khiljiGold)" />
  <text x="400" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. सराय-ए-अदल (वस्त्र व वस्तु)</text>
  <text x="300" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• रेशम, कपड़े, चीनी, तेल का बाजार</text>
  <text x="300" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• निर्मित माल हेतु राजकीय सब्सिडी</text>
  <text x="300" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• न्याय का स्थान (न्यायपालिका संबद्ध)</text>

  <!-- Market 3 -->
  <rect x="540" y="195" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)" />
  <rect x="540" y="195" width="220" height="35" rx="10" fill="url(#khiljiGold)" />
  <text x="650" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. दास, घोड़ा व मवेशी बाजार</text>
  <text x="550" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• घोड़ों की तीन श्रेणियां तय थीं</text>
  <text x="550" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• दलालों (Middlemen) पर पूर्ण प्रतिबंध</text>
  <text x="550" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155">• दासों एवं पशुओं के दाम निश्चित</text>

  <!-- Footer Info -->
  <rect x="40" y="365" width="720" height="40" rx="6" fill="#F1F5F9" />
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-style="italic" fill="#475569" text-anchor="middle">कठोर दंड प्रणाली: कम तोलने वाले व्यापारी के शरीर से उतना ही मांस काट लेने का शाही आदेश था।</text>
</svg>