<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%">
  <defs>
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Title block -->
  <rect x="250" y="20" width="300" height="50" rx="8" fill="url(#darkBlue)" filter="url(#boxShadow)" />
  <text x="400" y="52" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">स्वदेशी आंदोलन घटनाक्रम (1905)</text>

  <!-- Flow Lines -->
  <path d="M 400 70 L 400 120" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 400 180 L 400 230" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 400 290 L 400 340" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Node 1 -->
  <rect x="150" y="120" width="500" height="60" rx="8" fill="url(#tealGrad)" filter="url(#boxShadow)" />
  <text x="400" y="145" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">20 जुलाई 1905: बंगाल विभाजन की आधिकारिक घोषणा</text>
  <text x="400" y="165" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">वायसराय लॉर्ड कर्जन द्वारा फूट डालो और राज करो की नीति के तहत निर्णय</text>

  <!-- Node 2 -->
  <rect x="150" y="230" width="500" height="60" rx="8" fill="url(#tealGrad)" filter="url(#boxShadow)" />
  <text x="400" y="255" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">7 अगस्त 1905: टाउन हॉल कलकत्ता में ऐतिहासिक बैठक</text>
  <text x="400" y="275" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">स्वदेशी आंदोलन की शुरुआत एवं विदेशी वस्तुओं के बहिष्कार का प्रस्ताव पारित</text>

  <!-- Node 3 -->
  <rect x="150" y="340" width="500" height="60" rx="8" fill="url(#emeraldGrad)" filter="url(#boxShadow)" />
  <text x="400" y="365" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">16 अक्टूबर 1905: बंगाल विभाजन प्रभावी (लागू)</text>
  <text x="400" y="385" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">पूरे बंगाल में 'शोक दिवस' एवं रवींद्रनाथ टैगोर के आह्वान पर 'राखी दिवस' मनाया गया</text>

  <!-- Footnote inside SVG -->
  <rect x="150" y="430" width="500" height="40" rx="6" fill="#F1F5F9" stroke="#E2E8F0" />
  <text x="400" y="455" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">रणनीति: विदेशी वस्तुओं की होली जलाना, मैनचेस्टर के कपड़ों और लिवरपूल के नमक का बहिष्कार।</text>
</svg>