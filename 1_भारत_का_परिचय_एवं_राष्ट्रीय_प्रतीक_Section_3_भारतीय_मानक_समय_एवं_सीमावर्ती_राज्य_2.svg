<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <rect width="800" height="300" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="2"/>
  
  <text x="400" y="35" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">भारतीय मानक समय रेखा (82°30' E) पर स्थित 5 राज्य</text>

  <!-- Horizontal Timeline/Flow Process for 5 states -->
  <!-- Line connecting all -->
  <path d="M 80 150 L 720 150" stroke="#94A3B8" stroke-width="4" stroke-dasharray="2,2"/>

  <!-- UP -->
  <circle cx="120" cy="150" r="25" fill="url(#emeraldGrad)" />
  <text x="120" y="154" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">1. UP</text>
  <text x="120" y="200" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">उत्तर प्रदेश</text>
  <text x="120" y="220" fill="#64748B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(प्रयागराज/मिर्जापुर)</text>

  <!-- MP -->
  <circle cx="260" cy="150" r="25" fill="url(#emeraldGrad)" />
  <text x="260" y="154" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2. MP</text>
  <text x="260" y="200" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">मध्य प्रदेश</text>

  <!-- CG -->
  <circle cx="400" cy="150" r="25" fill="url(#emeraldGrad)" />
  <text x="400" y="154" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3. CG</text>
  <text x="400" y="200" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">छत्तीसगढ़</text>

  <!-- OD -->
  <circle cx="540" cy="150" r="25" fill="url(#emeraldGrad)" />
  <text x="540" y="154" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4. OD</text>
  <text x="540" y="200" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ओडिशा</text>

  <!-- AP -->
  <circle cx="680" cy="150" r="25" fill="url(#emeraldGrad)" />
  <text x="680" y="154" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">5. AP</text>
  <text x="680" y="200" fill="#334155" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">आंध्र प्रदेश</text>
</svg>