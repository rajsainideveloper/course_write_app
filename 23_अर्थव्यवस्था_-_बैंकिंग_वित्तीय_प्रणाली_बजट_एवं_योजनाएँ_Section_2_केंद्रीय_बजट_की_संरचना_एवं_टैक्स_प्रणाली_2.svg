<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%">
  <defs>
    <linearGradient id="revGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Budget Header -->
  <rect x="250" y="20" width="300" height="50" rx="8" fill="#64748B" filter="url(#boxShadow)" />
  <text x="400" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">बजट संरचना (Budget Structure)</text>

  <!-- Flow Lines -->
  <path d="M 400 70 L 400 120 L 200 120 L 200 150" stroke="#94A3B8" stroke-width="2" fill="none" />
  <path d="M 400 120 L 600 120 L 600 150" stroke="#94A3B8" stroke-width="2" fill="none" />

  <!-- Revenue Budget -->
  <g transform="translate(70, 150)" filter="url(#boxShadow)">
    <rect width="260" height="250" rx="10" fill="url(#revGrad)" />
    <text x="130" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. राजस्व बजट (Revenue Budget)</text>
    <line x1="20" y1="45" x2="240" y2="45" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.5" />
    
    <text x="20" y="75" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">राजस्व प्राप्तियाँ (Revenue Receipts):</text>
    <text x="30" y="100" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• कर राजस्व (Direct &amp; Indirect Taxes)</text>
    <text x="30" y="120" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• गैर-कर राजस्व (ब्याज, लाभांश, फीस)</text>
    
    <text x="20" y="165" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">राजस्व व्यय (Revenue Expenditure):</text>
    <text x="30" y="190" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• परिसंपत्तियों का निर्माण नहीं होता</text>
    <text x="30" y="210" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• (जैसे: ब्याज भुगतान, रक्षा वेतन, सब्सिडी)</text>
  </g>

  <!-- Capital Budget -->
  <g transform="translate(470, 150)" filter="url(#boxShadow)">
    <rect width="260" height="250" rx="10" fill="url(#capGrad)" />
    <text x="130" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. पूँजीगत बजट (Capital Budget)</text>
    <line x1="20" y1="45" x2="240" y2="45" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.5" />
    
    <text x="20" y="75" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">पूँजीगत प्राप्तियाँ (Capital Receipts):</text>
    <text x="30" y="100" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• देयता निर्मित होती है या संपत्तियां कम होती हैं</text>
    <text x="30" y="120" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• (जैसे: बाजार से लिया ऋण, विनिवेश प्राप्तियाँ)</text>
    
    <text x="20" y="165" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="start">पूँजीगत व्यय (Capital Expenditure):</text>
    <text x="30" y="190" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• दीर्घकालिक परिसंपत्तियों का निर्माण</text>
    <text x="30" y="210" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">• (जैसे: बुनियादी ढांचा निर्माण, हाईवे, स्कूल)</text>
  </g>
</svg>