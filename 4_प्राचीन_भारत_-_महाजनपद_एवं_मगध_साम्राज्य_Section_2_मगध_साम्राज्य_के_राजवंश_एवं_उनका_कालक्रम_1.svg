<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="haryankaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="shishunagaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="nandaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#F8FAFC" rx="15"/>
  <text x="400" y="35" fill="#1E293B" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">मगध साम्राज्य के प्रारंभिक राजवंश (कालक्रम)</text>

  <!-- Connectors -->
  <path d="M 230 150 L 320 150" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 150 L 570 150" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Haryanka Dynasty -->
  <rect x="30" y="80" width="200" height="140" rx="10" fill="url(#haryankaGrad)" filter="url(#boxShadow)"/>
  <text x="130" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. हर्यंक वंश</text>
  <text x="130" y="145" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">(544 ई.पू. - 412 ई.पू.)</text>
  <path d="M 50 165 L 210 165" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="130" y="185" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">संस्थापक: बिम्बिसार</text>
  <text x="130" y="205" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">प्रसिद्ध: अजातशत्रु, उदयन</text>

  <!-- Shishunaga Dynasty -->
  <rect x="280" y="80" width="200" height="140" rx="10" fill="url(#shishunagaGrad)" filter="url(#boxShadow)"/>
  <text x="380" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. शिशुनाग वंश</text>
  <text x="380" y="145" fill="#CCFBF1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">(412 ई.पू. - 344 ई.पू.)</text>
  <path d="M 300 165 L 460 165" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="380" y="185" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">संस्थापक: शिशुनाग</text>
  <text x="380" y="205" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">प्रसिद्ध: कालाशोक</text>

  <!-- Nanda Dynasty -->
  <rect x="530" y="80" width="200" height="140" rx="10" fill="url(#nandaGrad)" filter="url(#boxShadow)"/>
  <text x="630" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. नंद वंश</text>
  <text x="630" y="145" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">(344 ई.पू. - 322 ई.पू.)</text>
  <path d="M 550 165 L 710 165" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <text x="630" y="185" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">संस्थापक: महापद्म नंद</text>
  <text x="630" y="205" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">अंतिम शासक: घनानंद</text>

  <!-- Footnote info inside diagram -->
  <rect x="30" y="260" width="700" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="50" y="290" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">प्रशासनिक बदलाव संकेतिका:</text>
  <text x="50" y="315" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">• हर्यंक वंश के उदयन ने राजधानी को राजगृह से 'पाटलिपुत्र' (गंगा-सोन संगम) स्थानांतरित किया।</text>
  <text x="50" y="340" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">• शिशुनाग ने वैशाली को राजधानी बनाया, किंतु कालाशोक इसे पुनः पाटलिपुत्र ले गया।</text>
</svg>