<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <linearGradient id="gradSkull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAxial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Box -->
  <rect x="250" y="20" width="300" height="50" rx="10" fill="url(#gradSkull)" filter="url(#shadow)"/>
  <text x="400" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dy=".3em">मानव कंकाल तंत्र (206 अस्थियां)</text>

  <!-- Connectors -->
  <path d="M 320 70 L 220 130" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 70 L 580 130" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Axial Skeleton -->
  <rect x="100" y="130" width="240" height="60" rx="10" fill="url(#gradAxial)" filter="url(#shadow)"/>
  <text x="220" y="150" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">अक्षीय कंकाल (Axial Skeleton)</text>
  <text x="220" y="172" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" dy=".3em">कुल अस्थियां = 80</text>

  <!-- Appendicular Skeleton -->
  <rect x="460" y="130" width="240" height="60" rx="10" fill="url(#gradApp)" filter="url(#shadow)"/>
  <text x="580" y="150" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dy=".3em">उपांगीय कंकाल (Appendicular)</text>
  <text x="580" y="172" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" dy=".3em">कुल अस्थियां = 126</text>

  <!-- Axial Details -->
  <rect x="80" y="220" width="280" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="245" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• कपाल/करोटी (Skull): 29 (अस्थियां + कर्ण + हाइओइड)</text>
  <text x="100" y="275" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• मेरुदंड (Vertebral Column): 26</text>
  <text x="100" y="305" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• पसलियां (Ribs): 24 (12 जोड़े)</text>
  <text x="100" y="335" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• उरोस्थि (Sternum): 01</text>

  <!-- Appendicular Details -->
  <rect x="440" y="220" width="280" height="150" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="245" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• अग्रपाद/हाथ (Upper Limbs): 60</text>
  <text x="460" y="275" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• पश्चपाद/पैर (Lower Limbs): 60</text>
  <text x="460" y="305" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• अंस मेखला (Pectoral Girdle): 04</text>
  <text x="460" y="335" fill="#1E293B" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">• श्रोणि मेखला (Pelvic Girdle): 02</text>
</svg>